<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<title>翠緑の谷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap">
<style>
  /* Layout: one full-screen valley scene; quiet glass controls float at the corners. Single look by choice. */
  :root {
    color-scheme: dark;
    --deep: #0c1f1a;
    --ink: #f6fcf3;
    --ink-soft: #d6e8d8;
    --glass: rgba(10, 34, 30, 0.52);
    --glass-line: rgba(214, 240, 220, 0.3);
    --ember: #ffd27a;
    --aether: #8ff0d0;
    --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --ui: -apple-system, "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--deep);
    color: var(--ink);
    font-family: var(--ui);
    overflow: hidden;
    position: relative;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: absolute; inset: 0; }
  #scene { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .hud {
    position: absolute; left: 0; right: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 12px; pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .hud-top { top: 14px; justify-content: space-between; align-items: flex-start; }
  .hud-bottom { bottom: 16px; flex-direction: column; align-items: center; gap: 10px; }

  .title { pointer-events: none; text-shadow: 0 1px 3px rgba(6, 30, 40, 0.75), 0 2px 18px rgba(6, 30, 40, 0.7); }
  .title small {
    display: block; font-size: 10px; letter-spacing: 0.32em; color: var(--ink);
    text-transform: uppercase; margin-bottom: 4px;
  }
  .title h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: 0.12em; }

  .badge {
    font-size: 11px; letter-spacing: 0.08em; padding: 6px 10px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-line); color: var(--ink-soft);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); }
  .badge.gpu i { background: var(--aether); box-shadow: 0 0 8px var(--aether); }
  .badge.gl i { background: var(--ember); box-shadow: 0 0 8px var(--ember); }

  .hint { font-size: 12px; color: var(--ink); text-shadow: 0 1px 3px rgba(6, 30, 40, 0.9), 0 1px 12px rgba(6, 30, 40, 0.9); transition: opacity 1.2s; text-align: center; }
  .hint.gone { opacity: 0; }

  .bar {
    display: flex; gap: 2px; padding: 4px; border-radius: 999px; max-width: 100%;
    background: var(--glass); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .bar button {
    font: inherit; font-size: 13px; color: var(--ink-soft); background: transparent; border: 0;
    padding: 9px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .bar button[aria-pressed="true"] { background: rgba(214, 240, 220, 0.24); color: var(--ink); }
  .bar button:focus-visible { outline: 2px solid var(--aether); outline-offset: 1px; }
  .bar .sep { width: 1px; background: var(--glass-line); margin: 6px 2px; }

  #veil {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 60%, #1f5a45 0%, var(--deep) 70%);
    transition: opacity 1.4s ease; padding: 24px;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil p { font-family: var(--display); font-size: 16px; letter-spacing: 0.3em; color: var(--ink-soft); margin: 0; line-height: 1.9; }
  @media (prefers-reduced-motion: reduce) { #veil, .hint { transition: none; } }
</style>

<div id="stage"><canvas id="scene" tabindex="0" aria-label="森と川が広がる谷の3D空間。ドラッグで見回せます"></canvas></div>

<div class="hud hud-top">
  <div class="title"><small>Verdant Vale</small><h1>翠緑の谷</h1></div>
  <div class="badge" id="badge"><i></i><span id="badgeText">起動中</span></div>
</div>

<div class="hud hud-bottom">
  <div class="hint" id="hint">ドラッグで見回す ・ ピンチで近づく</div>
  <div class="bar" role="group" aria-label="視点">
    <button id="v0" aria-pressed="true">全景</button>
    <button id="v1" aria-pressed="false">大樹</button>
    <button id="v2" aria-pressed="false">滝</button>
    <button id="v3" aria-pressed="false">湖</button>
    <span class="sep"></span>
    <button id="auto" aria-pressed="true">自動回転</button>
  </div>
</div>

<div id="veil"><p id="veilText">森を呼び起こしています…</p></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.min.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.min.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.min.js"}}</script>
<script type="module">

  renderer = new THREE.WebGPURenderer({ canvas, antialias: true });

} catch (e) {
  fail('この端末では3D描画を開始できませんでした。');

/* ---------- scanned assets from Poly Haven (CC0): sky, ground, bark and leaves ---------- */
let SKY, GRASS_A, GRASS_B, FLOOR, ROCK, PEBBLES, GRASS_N, PEBBLES_N, BARK, BARK_N, CONIFER_ATLAS, BROAD_ATLAS;

  // Fetch each file and decode it from a local blob: the one loading path that works both on a normal server and inside a published page.
  const loadImage = async (name) => {
    const res = await fetch('assets/' + name);
    if (!res.ok) throw new Error(name + ' (' + res.status + ')');
    const img = new Image(); img.src = URL.createObjectURL(await res.blob());
    await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error(name + ' を画像として開けません')); });

  };

  const tex = (name, srgb = true, tile = true) => loadImage(name).then((img) => {

  const loadSky = async () => {
    const [rgb, ex] = await Promise.all([loadImage('sky_rgb.png'), loadImage('sky_e.png')]);
    const w = rgb.naturalWidth, h = rgb.naturalHeight;
    const read = (img) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0); return x.getImageData(0, 0, w, h).data; };
    const M = read(rgb), E = read(ex), out = new Uint16Array(w * h * 4), half = THREE.DataUtils.toHalfFloat, one = half(1);

    tex('grass_a_n.jpg', false), tex('pebbles_n.jpg', false), tex('bark.jpg'), tex('bark_n.jpg', false),
    tex('conifer.webp', true, false), tex('broadleaf.webp', true, false),

  jobs.forEach((j) => j.then(() => { $('veilText').textContent = '素材を読み込んでいます… ' + (++done) + ' / ' + jobs.length; }));

} catch (e) {
  fail('素材を読み込めませんでした。通信環境を確認して開き直してください。［' + String(e && e.message || e).slice(0, 80) + '］');

renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
const HORIZON = [0.33, 0.36, 0.39], HORIZON_SUN = [0.55, 0.62, 0.66];        // measured from the sky image (linear)
scene.fog = new THREE.FogExp2(new THREE.Color().setRGB(...HORIZON), 0.0022);

const camera = new THREE.PerspectiveCamera(55, 1, 0.5, 2400);

/* ---------- helpers ---------- */
let seed = 20261124;

const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();
const n01 = (p) => mx_noise_float(p).mul(0.5).add(0.5);          // shader noise in 0..1

  out.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  out.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
  out.setAttribute('tint', new THREE.Float32BufferAttribute(T, 3));

const unit = (x, y, z) => { const l = Math.hypot(x, y, z) || 1; return [x / l, y / l, z / l]; };

  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');

  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.18, 'rgba(255,255,255,0.75)');

  s.scale.setScalar(size); return s;

/* ---------- the shape of the land ---------- */

const riverW = (z) => (3.2 + 24 * sm(48, 80, z)) * (1 - sm(86, 97, z));            // widens into the lake
function mount(x, z) { const m = sm(88, 150, Math.hypot(x, z * 0.95)); return Math.pow(m, 1.3) * (52 + 40 * vnoise(x * 0.02 + 3, z * 0.02 + 7)); }

const forestAt = (x, z) => fbm(x * 0.018 + 5, z * 0.018 + 9);

const SUN = vec3(sunDir.x, sunDir.y, sunDir.z);
const viewRay = normalize(positionWorld.sub(cameraPosition));
const towardSun = pow(max(dot(viewRay, SUN), 0), 6);                       // 1 when looking into the sun
const hazeNode = mix(vec3(...HORIZON), vec3(...HORIZON_SUN), towardSun.mul(0.85));

  const moon = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 20), new THREE.MeshBasicMaterial({ color: 0xdfeaf8, transparent: true, opacity: o, fog: false, depthWrite: false }));

/* ---------- light and shadow ---------- */
const sunLight = new THREE.DirectionalLight(new THREE.Color().setRGB(1, 0.95, 0.854), 5.6);     // colour measured from the sky image
sunLight.position.copy(sunDir).multiplyScalar(480);

sunLight.shadow.mapSize.set(4096, 4096);
sunLight.shadow.radius = 2.5;
Object.assign(sunLight.shadow.camera, { left: -185, right: 185, top: 185, bottom: -185, near: 20, far: 960 });
sunLight.shadow.bias = -0.0012; sunLight.shadow.normalBias = 0.7;
sunLight.shadow.autoUpdate = false; sunLight.shadow.needsUpdate = true;      // the world is static: bake the shadow map once
scene.add(sunLight);
const lit = (m, cast = true, receive = true) => { m.castShadow = cast; m.receiveShadow = receive; return m; };

/* ---------- terrain: smooth surface, materials blended per pixel ---------- */
{
  const S = 360, SEG = 256;

    data[i * 3] = sm(0.44, 0.56, forestAt(x, z));                 // forest floor
    data[i * 3 + 1] = live ? 1 - sm(2.0, 4.8, sd) : 0;            // sand and shingle
    data[i * 3 + 2] = live ? 1 - sm(0.0, 2.4, sd) : 0;            // wet river bed

  const big = n01(vec3(wp.x.mul(0.03), wp.z.mul(0.03), 1));

  c = mix(c, two(FLOOR).mul(0.78), d.x.mul(0.9));

    const t0 = i / (N - 1) * 2 - 1, t1 = (i + 2) / (N - 1) * 2 - 1;
    const a = new THREE.Vector3(t0 * half, 2.05 + 1.5 * (1 - t0 * t0), s * 1.2), b = new THREE.Vector3(t1 * half, 2.05 + 1.5 * (1 - t1 * t1), s * 1.2);
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, a.distanceTo(b), 5), wood);
    rail.position.copy(a).add(b).multiplyScalar(0.5); rail.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); g.add(lit(rail));
  }
  scene.add(g);
}

/* spirit crystals: a little magic by the water */
const crystalGeo = new THREE.OctahedronGeometry(1, 0); crystalGeo.scale(0.36, 1, 0.36);
function crystalCluster(x, z, hex, big) {
  const mat = new THREE.MeshPhysicalMaterial({ color: hex, emissive: hex, emissiveIntensity: 0.9, roughness: 0.08, metalness: 0, clearcoat: 1 });
  const g = new THREE.Group(); g.position.set(x, ground(x, z), z);
  const n = 4 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const c = new THREE.Mesh(crystalGeo, mat), s = (i === 0 ? 1.5 : rr(0.5, 1.1)) * big, a = rnd() * 6.28, d = i === 0 ? 0 : rr(0.35, 0.8) * big;
    c.scale.setScalar(s); c.position.set(Math.cos(a) * d, s * 0.7, Math.sin(a) * d); c.rotation.set(rr(-0.35, 0.35), rnd() * 6.28, rr(-0.35, 0.35)); g.add(lit(c, true, false));
  }
  const gl = glow(hex, 7 * big, 0.45); gl.position.y = 1.3 * big; g.add(gl);
  scene.add(g);
}
crystalCluster(riverX(fallBot + 4) + 8, fallBot + 5, 0x7fe7ff, 1.5);
crystalCluster(riverX(fallBot + 2) - 9, fallBot + 3, 0x9ff5d0, 1.1);
crystalCluster(riverX(70) - riverW(70) - 6, 70, 0x7fe7ff, 1.2);
crystalCluster(treeX + 9, treeZ + 7, 0xffe08a, 0.9);

/* shafts of sunlight through the canopy and the waterfall mist */
const shaftMats = [];
{
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 256;
  const x = cv.getContext('2d');
  let gr = x.createLinearGradient(0, 0, 64, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 256);
  x.globalCompositeOperation = 'destination-in';
  gr = x.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.25, 'rgba(0,0,0,0.9)'); gr.addColorStop(0.8, 'rgba(0,0,0,0.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 256);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  for (let i = 0; i < 3; i++) shaftMats.push(new THREE.MeshBasicMaterial({ map: tex, color: 0xfff0d2, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
  const plane = new THREE.PlaneGeometry(1, 1), up = new THREE.Vector3(0, 1, 0);
  const lee = new THREE.Vector3(-sunDir.x, 0, -sunDir.z).normalize(), across = new THREE.Vector3(-lee.z, 0, lee.x);
  const shaft = (gx, gz, len, wid) => {
    const g = new THREE.Group(), gy = Math.max(ground(gx, gz), waterAt(gx, gz));
    g.position.set(gx, gy, gz).addScaledVector(sunDir, len / 2); g.quaternion.setFromUnitVectors(up, sunDir);
    for (let k = 0; k < 2; k++) { const m = new THREE.Mesh(plane, pick(shaftMats)); m.scale.set(wid, len, 1); m.rotation.y = k * Math.PI / 2 + rnd(); g.add(m); }
    scene.add(g);
  };
  for (let i = 0; i < 9; i++) { const a = rr(3, 20), b = rr(-11, 11); shaft(treeX + lee.x * a + across.x * b, treeZ + lee.z * a + across.z * b, rr(42, 58), rr(3.5, 7)); }
  for (let i = 0; i < 5; i++) shaft(riverX(fallBot) + rr(-7, 7), fallBot + rr(0, 7), rr(30, 42), rr(4, 7));
  for (let i = 0; i < 10; i++) { const z = rr(-50, 60), sd = rnd() < 0.5 ? -1 : 1; shaft(riverX(z) + sd * (riverW(z) + rr(5, 16)), z, rr(26, 38), rr(3, 5.5)); }
}

/* birds */
const BIRD_N = 18, birdData = [];
const birdGeo = new THREE.BufferGeometry();
birdGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0.5, 0, 0, -0.4, -1.3, 0.4, -0.25, 0, 0, 0.5, 1.3, 0.4, -0.25, 0, 0, -0.4]), 3));
birdGeo.computeVertexNormals();
const birds = new THREE.InstancedMesh(birdGeo, new THREE.MeshBasicMaterial({ color: 0x1e242c, side: THREE.DoubleSide }), BIRD_N);
for (let i = 0; i < BIRD_N; i++) { const flock = i % 3; birdData.push({ r: 34 + flock * 22 + rr(-5, 5), a: flock * 2.1 + rr(-0.25, 0.25), y: 42 + flock * 12 + rr(-3, 3), w: (0.11 - flock * 0.02) * (flock === 1 ? -1 : 1), p: rnd() * 6.28, cx: flock * 20 - 20, cz: flock * -25 + 20 }); }
birds.frustumCulled = false; scene.add(birds);

/* drifting motes of light around the great tree and the water */
const FLY_N = 170, flyData = [];
const flies = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.8 }), FLY_N);
for (let i = 0; i < FLY_N; i++) {
  let x, z, up;
  if (rnd() < 0.6) { const a = rnd() * 6.283, d = Math.sqrt(rnd()) * 17; x = treeX + Math.cos(a) * d; z = treeZ + Math.sin(a) * d; up = rr(1, 30); }
  else { z = rr(-64, 92); x = riverX(z) + rr(-1, 1) * (riverW(z) + 7); up = rr(0.8, 5); }
  flyData.push({ x, y: Math.max(ground(x, z), waterAt(x, z)) + up, z, p: rnd() * 6.28, f: rr(0.3, 0.9), s: rr(0.3, 0.7) });
  flies.setColorAt(i, tmpColor.set(rnd() < 0.7 ? 0xffe9a0 : 0xbffff0));
}
flies.frustumCulled = false; scene.add(flies);

/* ---------- camera control ---------- */
const VIEWS = [
  { t: [0, 8, -8], r: 140, th: 0.3, ph: 0.98 },
  { t: [treeX, treeY + 15, treeZ], r: 56, th: 4.75, ph: 1.3 },
  { t: [fallMidX, fallBaseY + 4, fallMidZ], r: 58, th: 0.2, ph: 1.02 },
  { t: [riverX(72), 4, 72], r: 62, th: 3.5, ph: 1.22 },
];
const cur = { th: 0.3, ph: 0.8, r: 215, t: new THREE.Vector3(0, 8, -8) };
const goal = { th: 0.3, ph: 0.98, r: 140, t: new THREE.Vector3(0, 8, -8) };
let auto = !matchMedia('(prefers-reduced-motion: reduce)').matches;
$('auto').setAttribute('aria-pressed', String(auto));
let lastTouch = -10, now = 0;
const R_MIN = 12, R_MAX = 175, PH_MIN = 0.3, PH_MAX = 1.55;
const pts = new Map(); let pinch = 0;
const touched = () => { lastTouch = now; $('hint').classList.add('gone'); };
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; touched(); });
canvas.addEventListener('pointermove', (e) => {
  const p = pts.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p[0], dy = e.clientY - p[1]; p[0] = e.clientX; p[1] = e.clientY;
  if (pts.size === 1) {
    goal.th -= dx * 0.006; goal.ph = Math.min(PH_MAX, Math.max(PH_MIN, goal.ph - dy * 0.005));
  } else if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch > 0) goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r * pinch / d));
    pinch = d;
  }
  touched();
});
const up = (e) => { pts.delete(e.pointerId); pinch = 0; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r * Math.exp(e.deltaY * 0.001))); touched(); }, { passive: false });
canvas.addEventListener('keydown', (e) => {
  const k = e.key; let hit = true;
  if (k === 'ArrowLeft') goal.th += 0.12; else if (k === 'ArrowRight') goal.th -= 0.12;
  else if (k === 'ArrowUp') goal.ph = Math.max(PH_MIN, goal.ph - 0.08); else if (k === 'ArrowDown') goal.ph = Math.min(PH_MAX, goal.ph + 0.08);
  else if (k === '+' || k === '=') goal.r = Math.max(R_MIN, goal.r * 0.9); else if (k === '-') goal.r = Math.min(R_MAX, goal.r * 1.1);
  else hit = false;
  if (hit) { e.preventDefault(); touched(); }
});
VIEWS.forEach((v, i) => $('v' + i).addEventListener('click', () => {
  goal.t.set(...v.t); goal.r = v.r; goal.ph = v.ph;
  goal.th = v.th + Math.round((goal.th - v.th) / 6.2832) * 6.2832;
  VIEWS.forEach((_, j) => $('v' + j).setAttribute('aria-pressed', String(i === j)));
  $('hint').classList.add('gone');
}));
$('auto').addEventListener('click', () => { auto = !auto; $('auto').setAttribute('aria-pressed', String(auto)); lastTouch = -10; });

let dpr = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w < h ? 72 : 55; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

/* ---------- bloom: bright light bleeds softly (skipped if the add-on cannot load) ---------- */
let post = null;
try {
  const { bloom } = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/tsl/display/BloomNode.js');
  const scenePass = pass(scene, camera), col = scenePass.getTextureNode('output');
  post = new THREE.PostProcessing(renderer);
  post.outputNode = col.add(bloom(col, 0.32, 0.55, 1.0));
} catch (e) { post = null; }

/* ---------- frame loop ---------- */
const clock = new THREE.Clock();
let first = true, acc = 0, frames = 0;
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05); now += dt; const t = now;

  // keep it smooth: if frames run long, render at a lower resolution
  if (t > 3) { acc += raw; frames++; if (acc > 2) { if (acc / frames > 0.03 && dpr > 1) { dpr = Math.max(1, dpr - 0.35); resize(); } acc = 0; frames = 0; } }

  if (auto && pts.size === 0 && t - lastTouch > 2.5) goal.th += dt * 0.06;
  const k = 1 - Math.exp(-dt * 3.2);
  cur.th += (goal.th - cur.th) * k; cur.ph += (goal.ph - cur.ph) * k; cur.r += (goal.r - cur.r) * k; cur.t.lerp(goal.t, k);
  const sp = Math.sin(cur.ph);
  camera.position.set(cur.t.x + cur.r * sp * Math.sin(cur.th), cur.t.y + cur.r * Math.cos(cur.ph), cur.t.z + cur.r * sp * Math.cos(cur.th));
  const floor = Math.max(ground(camera.position.x, camera.position.z), waterAt(camera.position.x, camera.position.z)) + 3;   // never dip under the land
  if (camera.position.y < floor) camera.position.y = floor;
  camera.lookAt(cur.t);

  for (const m of mists) { m.s.scale.setScalar(m.base * (1 + 0.18 * Math.sin(t * 0.9 + m.p))); m.s.material.opacity = 0.22 + 0.1 * Math.sin(t * 0.7 + m.p * 2); }

  for (let i = 0; i < BIRD_N; i++) {
    const d = birdData[i], a = d.a + t * d.w;
    dummy.position.set(d.cx + Math.cos(a) * d.r, d.y + Math.sin(t * 0.5 + d.p) * 1.5, d.cz + Math.sin(a) * d.r);
    dummy.rotation.set(0, -a + (d.w < 0 ? Math.PI : 0), 0); dummy.scale.set(1, Math.sin(t * 7 + d.p) * 1.2, 1);
    dummy.updateMatrix(); birds.setMatrixAt(i, dummy.matrix);
  }
  birds.instanceMatrix.needsUpdate = true;

  dummy.quaternion.copy(camera.quaternion);
  for (let i = 0; i < FLY_N; i++) {
    const d = flyData[i], a = t * d.f + d.p;
    dummy.position.set(d.x + Math.sin(a) * 1.6, d.y + Math.sin(a * 1.7 + d.p) * 1.0, d.z + Math.cos(a * 0.8) * 1.6);
    dummy.scale.setScalar(d.s * (0.55 + 0.45 * Math.sin(t * 2.5 * d.f + d.p * 3)));
    dummy.updateMatrix(); flies.setMatrixAt(i, dummy.matrix);
  }
  flies.instanceMatrix.needsUpdate = true;

  for (let i = 0; i < shaftMats.length; i++) shaftMats[i].opacity = 0.05 + 0.022 * Math.sin(t * 0.35 + i * 2.1);
  if (post) { try { post.render(); } catch (e) { post = null; renderer.render(scene, camera); } }
  else renderer.render(scene, camera);
  if (first) { first = false; $('veil').classList.add('gone'); setTimeout(() => $('hint').classList.add('gone'), 9000); }
});
</script>
</body>
</html>
