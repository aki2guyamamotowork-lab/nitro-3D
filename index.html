<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<title>翠緑の谷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap">
<style>
  /* Layout: one full-screen valley scene; quiet glass controls float at the corners. Single look by choice. */
  :root {
    color-scheme: dark;
    --deep: #0c1f1a;
    --ink: #f6fcf3;
    --ink-soft: #d6e8d8;
    --glass: rgba(10, 34, 30, 0.52);
    --glass-line: rgba(214, 240, 220, 0.3);
    --ember: #ffd27a;
    --aether: #8ff0d0;
    --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --ui: -apple-system, "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--deep);
    color: var(--ink);
    font-family: var(--ui);
    overflow: hidden;
    position: relative;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: absolute; inset: 0; }
  #scene { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .hud {
    position: absolute; left: 0; right: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 12px; pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .hud-top { top: 14px; justify-content: space-between; align-items: flex-start; }
  .hud-bottom { bottom: 16px; flex-direction: column; align-items: center; gap: 10px; }

  .title { pointer-events: none; text-shadow: 0 1px 3px rgba(6, 30, 40, 0.75), 0 2px 18px rgba(6, 30, 40, 0.7); }
  .title small {
    display: block; font-size: 10px; letter-spacing: 0.32em; color: var(--ink);
    text-transform: uppercase; margin-bottom: 4px;
  }
  .title h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: 0.12em; }

  .badge {
    font-size: 11px; letter-spacing: 0.08em; padding: 6px 10px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-line); color: var(--ink-soft);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); }
  .badge.gpu i { background: var(--aether); box-shadow: 0 0 8px var(--aether); }
  .badge.gl i { background: var(--ember); box-shadow: 0 0 8px var(--ember); }

  .hint { font-size: 12px; color: var(--ink); text-shadow: 0 1px 3px rgba(6, 30, 40, 0.9), 0 1px 12px rgba(6, 30, 40, 0.9); transition: opacity 1.2s; text-align: center; }
  .hint.gone { opacity: 0; }

  .bar {
    display: flex; gap: 2px; padding: 4px; border-radius: 999px; max-width: 100%;
    background: var(--glass); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .bar button {
    font: inherit; font-size: 13px; color: var(--ink-soft); background: transparent; border: 0;
    padding: 9px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .bar button[aria-pressed="true"] { background: rgba(214, 240, 220, 0.24); color: var(--ink); }
  .bar button:focus-visible { outline: 2px solid var(--aether); outline-offset: 1px; }
  .bar .sep { width: 1px; background: var(--glass-line); margin: 6px 2px; }

  #veil {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 60%, #1f5a45 0%, var(--deep) 70%);
    transition: opacity 1.4s ease; padding: 24px;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil p { font-family: var(--display); font-size: 16px; letter-spacing: 0.3em; color: var(--ink-soft); margin: 0; line-height: 1.9; }
  @media (prefers-reduced-motion: reduce) { #veil, .hint { transition: none; } }
</style>

<div id="stage"><canvas id="scene" tabindex="0" aria-label="森と川が広がる谷の3D空間。ドラッグで見回せます"></canvas></div>

<div class="hud hud-top">
  <div class="title"><small>Verdant Vale</small><h1>翠緑の谷</h1></div>
  <div class="badge" id="badge"><i></i><span id="badgeText">起動中</span></div>
</div>

<div class="hud hud-bottom">
  <div class="hint" id="hint">ドラッグで見回す ・ ピンチで近づく</div>
  <div class="bar" role="group" aria-label="視点">
    <button id="v0" aria-pressed="true">全景</button>
    <button id="v1" aria-pressed="false">大樹</button>
    <button id="v2" aria-pressed="false">滝</button>
    <button id="v3" aria-pressed="false">湖</button>
    <span class="sep"></span>
    <button id="auto" aria-pressed="true">自動回転</button>
  </div>
</div>

<div id="veil"><p id="veilText">森を呼び起こしています…</p></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const fail = (msg) => { $('veilText').textContent = msg; $('badgeText').textContent = '停止'; };

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.min.js');
} catch (e) {
  fail('three.js を読み込めませんでした。通信環境を確認して開き直してください。');
  throw e;
}
const { color, vec3, time, sin, cos, mix, smoothstep, positionLocal, positionWorld, uv, attribute,
        mx_noise_float, pow, normalize, dot, max, abs, clamp } = THREE.TSL;

/* ---------- renderer (WebGPU, falls back to WebGL 2 by itself) ---------- */
const canvas = $('scene');
const stage = $('stage');
let renderer;
try {
  renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
  await renderer.init();
} catch (e) {
  fail('この端末では3D描画を開始できませんでした。');
  throw e;
}
const isGPU = renderer.backend && renderer.backend.isWebGPUBackend === true;
$('badge').classList.add(isGPU ? 'gpu' : 'gl');
$('badgeText').textContent = isGPU ? 'WebGPU' : 'WebGL 2';
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const FOG = 0xbfe3f0;
scene.fog = new THREE.FogExp2(FOG, 0.0026);
const camera = new THREE.PerspectiveCamera(55, 1, 0.5, 2400);

/* ---------- helpers ---------- */
let seed = 20261124;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const pick = (a) => a[Math.floor(rnd() * a.length)];
const hash = (x, y, z, s) => { const n = Math.sin(Math.round(x * 100) * 1.271 + Math.round(y * 100) * 3.117 + Math.round(z * 100) * 0.747 + s * 13.37) * 43758.5453; return n - Math.floor(n); };
const flat = (g) => { const n = g.index ? g.toNonIndexed() : g; n.computeVertexNormals(); return n; };
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const h2 = (i, j) => { const n = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return n - Math.floor(n); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return (h2(xi, yi) * (1 - u) + h2(xi + 1, yi) * u) * (1 - v) + (h2(xi, yi + 1) * (1 - u) + h2(xi + 1, yi + 1) * u) * v;
}
function fbm(x, y) { let a = 0.5, s = 0, n = 0; for (let i = 0; i < 4; i++) { s += a * vnoise(x, y); n += a; x = x * 2.03 + 17; y = y * 2.03 + 31; a *= 0.5; } return s / n; }
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.18, 'rgba(255,255,255,0.75)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = glowTexture();
function glow(hex, size, opacity = 1, additive = true) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: hex, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false, transparent: true, opacity }));
  s.scale.setScalar(size); return s;
}

/* ---------- the shape of the land ---------- */
const riverX = (z) => 18 * Math.sin(z * 0.035) + 8 * Math.sin(z * 0.09 + 1);
const riverW = (z) => (3.2 + 24 * sm(48, 80, z)) * (1 - sm(86, 97, z));            // widens into the lake
function mount(x, z) { const m = sm(88, 150, Math.hypot(x, z * 0.95)); return Math.pow(m, 1.3) * (52 + 40 * vnoise(x * 0.02 + 3, z * 0.02 + 7)); }
function waterAt(x, z) {                                                             // water surface, incl. the waterfall step
  const zs = z + 6 * Math.sin(x * 0.05);
  return 2 + 6 * Math.min(1, Math.max(0, (48 - z) / 140)) + 10 * (1 - sm(-68.5, -65.5, zs)) + mount(x, z);
}
function ground(x, z) {
  const w = riverW(z), d = Math.abs(x - riverX(z)), live = 1 - sm(93, 98, z);
  const bank = 0.5 + live * (-1.9 + 1.9 * sm(w, w + 3.5, d));
  const hills = Math.max(-0.2, 17 * (fbm(x * 0.025, z * 0.025) - 0.25)) * sm(w + 3, w + 55, d)
              + 1.2 * (vnoise(x * 0.15, z * 0.15) - 0.5) * sm(w + 3, w + 10, d);
  return waterAt(x, z) + bank + hills;
}
const slopeAt = (x, z) => Math.hypot(ground(x + 1, z) - ground(x - 1, z), ground(x, z + 1) - ground(x, z - 1)) / 2;
const forestAt = (x, z) => fbm(x * 0.018 + 5, z * 0.018 + 9);
const shoreDist = (x, z) => Math.abs(x - riverX(z)) - riverW(z);

/* ---------- sky ---------- */
const sunDir = new THREE.Vector3(0.45, 0.58, 0.68).normalize();
{
  const dir = normalize(positionLocal);
  const h = dir.y;
  const toSun = pow(max(dot(dir, vec3(sunDir.x, sunDir.y, sunDir.z)), 0), 5);
  let c = mix(color(0xd9f0f2), color(0x62aee8), smoothstep(0.0, 0.42, h));
  c = mix(c, color(0x2c72cc), smoothstep(0.38, 0.95, h));
  const cp = dir.xz.div(h.add(0.32)).mul(1.5);
  const wisps = mx_noise_float(vec3(cp.x.add(time.mul(0.012)), cp.y, 2)).mul(0.6).add(mx_noise_float(vec3(cp.x.mul(2.7), cp.y.mul(2.7).add(time.mul(0.02)), 8)).mul(0.4)).mul(0.5).add(0.5);
  c = mix(c, color(0xffffff), smoothstep(0.52, 0.8, wisps).mul(smoothstep(0.06, 0.4, h)).mul(0.55));
  c = mix(c, color(0xfff3c8), toSun.mul(0.85));
  c = mix(color(FOG), c, smoothstep(-0.1, 0.05, h));
  const m = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, fog: false, depthWrite: false });
  m.colorNode = c;
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1100, 32, 20), m);
  sky.renderOrder = -10; scene.add(sky);

  const sun = glow(0xfff0c0, 520, 0.9); sun.material.fog = false; sun.position.copy(sunDir).multiplyScalar(900); sun.renderOrder = -9; scene.add(sun);
  // two pale day moons
  for (const [x, y, z, r, hex] of [[-520, 430, -640, 60, 0xf2f8ff], [-330, 520, -700, 20, 0xd8f4ee]]) {
    const moon = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 18), new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: 0.55, fog: false, depthWrite: false }));
    moon.position.set(x, y, z); moon.renderOrder = -9; scene.add(moon);
  }
}

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xd6ecff, 0x4d6b3a, 1.7));
const sunLight = new THREE.DirectionalLight(0xfff0d2, 3.0);
sunLight.position.copy(sunDir).multiplyScalar(100); scene.add(sunLight);

/* ---------- terrain ---------- */
{
  const S = 360, SEG = 200;
  let g = new THREE.PlaneGeometry(S, S, SEG, SEG); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, cols = new Float32Array(p.count * 3);
  const meadow = new THREE.Color(0x86c653), forest = new THREE.Color(0x3d8440), sand = new THREE.Color(0xcdbd8c),
        bed = new THREE.Color(0x5f8f7c), rock = new THREE.Color(0x7f8ba3), snow = new THREE.Color(0xf5f9ff), alpine = new THREE.Color(0x6f9a5a);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = ground(x, z);
    p.setY(i, y);
    const sd = shoreDist(x, z), live = z < 96, sl = slopeAt(x, z), alt = y - waterAt(x, z) + mount(x, z);
    tmpColor.copy(meadow).lerp(forest, sm(0.44, 0.56, forestAt(x, z)));
    tmpColor.lerp(alpine, sm(22, 36, y));
    if (live) { tmpColor.lerp(sand, 1 - sm(2.2, 4.6, sd)); tmpColor.lerp(bed, 1 - sm(0.2, 2.4, sd)); }
    tmpColor.lerp(rock, Math.max(sm(0.85, 1.35, sl), sm(34, 46, y)));
    tmpColor.lerp(snow, sm(52, 62, y + (vnoise(x * 0.1, z * 0.1) - 0.5) * 10) * (1 - sm(1.6, 2.6, sl) * 0.6));
    tmpColor.offsetHSL(0, 0, (h2(x * 3.1, z * 2.7) - 0.5) * 0.05);
    cols[i * 3] = tmpColor.r; cols[i * 3 + 1] = tmpColor.g; cols[i * 3 + 2] = tmpColor.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  g = flat(g);
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 })));
}

/* ---------- river, waterfall and lake: one ribbon that follows the water surface ---------- */
{
  const Z0 = -152, Z1 = 97, COLS = 9, rows = Z1 - Z0 + 1;
  const pos = new Float32Array(rows * COLS * 3), uvs = new Float32Array(rows * COLS * 2), foam = new Float32Array(rows * COLS), idx = [];
  for (let r = 0; r < rows; r++) {
    const z = Z0 + r, cx = riverX(z), hw = riverW(z) + 3.5;
    for (let c = 0; c < COLS; c++) {
      const u = c / (COLS - 1), x = cx + (u * 2 - 1) * hw, i = r * COLS + c;
      pos[i * 3] = x; pos[i * 3 + 1] = waterAt(x, z); pos[i * 3 + 2] = z;
      uvs[i * 2] = u; uvs[i * 2 + 1] = r / rows;
      foam[i] = sm(0.3, 1.1, Math.abs(waterAt(x, z + 0.5) - waterAt(x, z - 0.5)));
      if (r < rows - 1 && c < COLS - 1) idx.push(i, i + COLS, i + 1, i + 1, i + COLS, i + COLS + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setAttribute('foam', new THREE.BufferAttribute(foam, 1));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.MeshBasicNodeMaterial({ transparent: true, side: THREE.DoubleSide });
  const pw = positionWorld, flow = pw.z.mul(0.32).sub(time.mul(1.1));
  const n1 = mx_noise_float(vec3(pw.x.mul(0.3), flow, pw.y.mul(0.5))).mul(0.5).add(0.5);
  const n2 = mx_noise_float(vec3(pw.x.mul(0.9), flow.mul(2.4), pw.y.mul(1.4).add(5))).mul(0.5).add(0.5);
  const edge = abs(uv().x.sub(0.5)).mul(2);
  let c = mix(color(0x0e6f8c), color(0x3fc4cf), n1);
  c = mix(c, color(0xa6f0e0), smoothstep(0.5, 0.95, edge).mul(0.55));
  const f = clamp(attribute('foam', 'float').mul(0.75 ).add(attribute('foam', 'float').mul(n2).mul(0.6)).add(smoothstep(0.66, 0.9, n2).mul(0.3)), 0, 1);
  m.colorNode = mix(c, color(0xffffff), f).mul(1.08);
  m.opacityNode = mix(0.8, 1, f);
  scene.add(new THREE.Mesh(g, m));
}
// where the waterfall is
let fallTop = -72, fallBot = -60;
for (let z = -80; z < -50; z += 0.25) { const s = waterAt(riverX(z), z - 0.25) - waterAt(riverX(z), z + 0.25); if (s > 0.3) { fallTop = Math.min(fallTop === -72 ? z : fallTop, z); fallBot = z; } }
const fallMidZ = (fallTop + fallBot) / 2, fallMidX = riverX(fallMidZ), fallBaseY = waterAt(riverX(fallBot + 1), fallBot + 1);
const mists = [];
for (let i = 0; i < 7; i++) {
  const s = glow(0xffffff, rr(7, 13), 0.3, false);
  s.position.set(riverX(fallBot) + rr(-4, 4), fallBaseY + rr(0.5, 3), fallBot + rr(0, 3.5)); scene.add(s);
  mists.push({ s, p: rnd() * 6.28, base: s.scale.x });
}
const SPRAY_N = 110, sprayData = [];
const spray = new THREE.InstancedMesh(new THREE.BoxGeometry(0.16, 0.16, 0.9), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }), SPRAY_N);
for (let i = 0; i < SPRAY_N; i++) sprayData.push({ o: rnd(), a: rr(-1, 1), v: rr(0.35, 0.6), s: rr(0.6, 1.5) });
spray.frustumCulled = false; scene.add(spray);

/* ---------- forest ---------- */
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 1 });
const sway = (amt) => positionLocal.add(vec3(
  sin(time.mul(1.3).add(positionLocal.x.mul(0.35)).add(positionLocal.z.mul(0.27))).mul(amt), 0,
  cos(time.mul(1.05).add(positionLocal.z.mul(0.33))).mul(amt * 0.7)));
const leafMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.85 }); leafMat.positionNode = sway(0.1);
const trunkGeo = flat(new THREE.CylinderGeometry(0.1, 0.18, 1, 5)); trunkGeo.translate(0, 0.5, 0);
const coneGeo = flat(new THREE.ConeGeometry(0.85, 1.9, 6)); coneGeo.translate(0, 0.95, 0);
const blobGeo = new THREE.IcosahedronGeometry(1, 0);
const CONIFER = [0x1f6b4a, 0x2a7d4f, 0x1d5c52, 0x2f8a5a, 0x256e58];
const BROAD = [0x5fae3c, 0x7cc24a, 0x4f9e45, 0x9acb4e, 0x6bb84a, 0x5fae3c, 0x7cc24a, 0xe6c34a, 0xf4a9cc];

const treeX = riverX(8) + 21, treeZ = 8, treeY = ground(treeX, treeZ);   // the great tree
{
  const con = [], bro = [];
  let guard = 0;
  while (con.length + bro.length < 3300 && guard++ < 90000) {
    const a = rnd() * 6.283, d = Math.sqrt(rnd()) * 134, x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (shoreDist(x, z) < 4.8 && z < 98) continue;
    const y = ground(x, z); if (y > 44) continue;
    if (slopeAt(x, z) > 1.0) continue;
    const f = forestAt(x, z);
    if (f < 0.47 + rnd() * 0.06 && rnd() > 0.035) continue;
    if (Math.hypot(x - treeX, z - treeZ) < 11) continue;
    const conifer = y > 20 + rnd() * 8 || vnoise(x * 0.03 + 40, z * 0.03) > 0.56;
    (conifer ? con : bro).push([x, y, z]);
  }
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, con.length + bro.length);
  const cones = new THREE.InstancedMesh(coneGeo, leafMat, con.length * 2);
  const blobs = new THREE.InstancedMesh(blobGeo, leafMat, bro.length * 2);
  let ti = 0;
  con.forEach(([x, y, z], i) => {
    const s = rr(1.5, 3.0);
    dummy.rotation.set(0, rnd() * 6.28, 0);
    dummy.position.set(x, y - 0.2, z); dummy.scale.set(s, s * 1.5, s); dummy.updateMatrix(); trunks.setMatrixAt(ti++, dummy.matrix);
    tmpColor.set(pick(CONIFER)).offsetHSL(rr(-0.015, 0.015), 0, rr(-0.04, 0.04));
    dummy.position.y = y + s * 0.9; dummy.scale.setScalar(s); dummy.updateMatrix(); cones.setMatrixAt(i * 2, dummy.matrix); cones.setColorAt(i * 2, tmpColor);
    dummy.position.y = y + s * 1.95; dummy.scale.setScalar(s * 0.7); dummy.updateMatrix(); cones.setMatrixAt(i * 2 + 1, dummy.matrix); cones.setColorAt(i * 2 + 1, tmpColor.offsetHSL(0, 0, 0.05));
  });
  bro.forEach(([x, y, z], i) => {
    const s = rr(1.3, 2.4);
    dummy.rotation.set(0, rnd() * 6.28, 0);
    dummy.position.set(x, y - 0.2, z); dummy.scale.set(s * 1.3, s * 1.7, s * 1.3); dummy.updateMatrix(); trunks.setMatrixAt(ti++, dummy.matrix);
    tmpColor.set(pick(BROAD)).offsetHSL(rr(-0.015, 0.015), 0, rr(-0.04, 0.04));
    dummy.rotation.set(rnd(), rnd() * 6.28, rnd());
    dummy.position.set(x, y + s * 2.0, z); dummy.scale.set(s * 1.25, s * 1.05, s * 1.25); dummy.updateMatrix(); blobs.setMatrixAt(i * 2, dummy.matrix); blobs.setColorAt(i * 2, tmpColor);
    dummy.position.set(x + rr(-0.5, 0.5) * s, y + s * 2.9, z + rr(-0.5, 0.5) * s); dummy.scale.setScalar(s * 0.8); dummy.updateMatrix(); blobs.setMatrixAt(i * 2 + 1, dummy.matrix); blobs.setColorAt(i * 2 + 1, tmpColor.offsetHSL(0, 0, 0.05));
  });
  for (const m of [trunks, cones, blobs]) { m.frustumCulled = false; scene.add(m); }
}

/* meadow flowers */
{
  const N = 2600, fl = new THREE.InstancedMesh(new THREE.OctahedronGeometry(0.2, 0), new THREE.MeshStandardMaterial({ roughness: 0.6 }), N);
  const FL = [0xffffff, 0xffe066, 0xff9ec7, 0xb79cff, 0xff7a6a, 0xffffff];
  let n = 0, guard = 0;
  while (n < N && guard++ < 60000) {
    const a = rnd() * 6.283, d = Math.sqrt(rnd()) * 118, x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (shoreDist(x, z) < 4.2 && z < 98) continue;
    if (forestAt(x, z) > 0.5 || vnoise(x * 0.07, z * 0.07) < 0.45) continue;
    const y = ground(x, z); if (y > 30 || slopeAt(x, z) > 0.8) continue;
    dummy.position.set(x, y + 0.28, z); dummy.rotation.set(0, rnd() * 3, 0); dummy.scale.setScalar(rr(0.6, 1.2)); dummy.updateMatrix();
    fl.setMatrixAt(n, dummy.matrix); fl.setColorAt(n, tmpColor.set(pick(FL))); n++;
  }
  fl.count = n; fl.frustumCulled = false; scene.add(fl);
}

/* riverside boulders */
{
  const N = 320, rocks = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ color: 0x8f8d98, roughness: 0.95 }), N);
  for (let i = 0; i < N; i++) {
    const nearFall = i < 40, z = nearFall ? rr(fallTop - 3, fallBot + 6) : rr(-135, 92), w = riverW(z);
    const side = rnd() < 0.5 ? -1 : 1, off = nearFall && rnd() < 0.5 ? rr(-w, w) : side * (w + rr(0.6, 5));
    const x = riverX(z) + off, s = rr(0.4, 1.5) * (nearFall ? 1.4 : 1);
    dummy.position.set(x, ground(x, z) + s * 0.15, z); dummy.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6); dummy.scale.set(s, s * rr(0.5, 0.9), s * rr(0.7, 1)); dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix); rocks.setColorAt(i, tmpColor.setHSL(0.7, 0.05, rr(0.45, 0.62)));
  }
  rocks.frustumCulled = false; scene.add(rocks);
}

/* the great tree */
{
  const g = new THREE.Group(); g.position.set(treeX, treeY - 0.5, treeZ);
  const bark = new THREE.MeshStandardMaterial({ color: 0x6b4a36, roughness: 1 });
  let tg = new THREE.CylinderGeometry(1.9, 4.4, 22, 9, 5); tg.translate(0, 11, 0);
  const tp = tg.attributes.position;
  for (let i = 0; i < tp.count; i++) { const k = 1 + (hash(tp.getX(i), tp.getY(i), tp.getZ(i), 3) - 0.5) * 0.28; tp.setX(i, tp.getX(i) * k + Math.sin(tp.getY(i) * 0.25) * 0.5); tp.setZ(i, tp.getZ(i) * k); }
  g.add(new THREE.Mesh(flat(tg), bark));
  for (let i = 0; i < 6; i++) {            // roots
    const a = i / 6 * 6.283 + 0.3, root = new THREE.Mesh(flat(new THREE.ConeGeometry(1.5, 9, 5)), bark);
    root.position.set(Math.cos(a) * 4.6, 1.2, Math.sin(a) * 4.6); root.rotation.set(0, -a, 0); root.rotateZ(-1.15); g.add(root);
  }
  for (let i = 0; i < 5; i++) {            // boughs
    const a = i / 5 * 6.283, b = new THREE.Mesh(flat(new THREE.CylinderGeometry(0.5, 1.1, 11, 5)), bark);
    b.position.set(Math.cos(a) * 4, 22, Math.sin(a) * 4); b.rotation.set(0, -a, 0); b.rotateZ(-0.9); g.add(b);
  }
  const canopyMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.8 }); canopyMat.positionNode = sway(0.16);
  const N = 22, canopy = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), canopyMat, N);
  const CAN = [0x3fa55a, 0x52b866, 0x2f9460, 0x6cc56a, 0x8fd46e, 0xf0d060];
  for (let i = 0; i < N; i++) {
    const a = rnd() * 6.283, d = i < 4 ? rr(0, 3) : rr(5, 12.5), s = i < 4 ? rr(7, 8.5) : rr(4.2, 6.6);
    dummy.position.set(Math.cos(a) * d, (i < 4 ? 31 : rr(23, 30)) - d * 0.25, Math.sin(a) * d);
    dummy.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3); dummy.scale.set(s, s * 0.78, s); dummy.updateMatrix();
    canopy.setMatrixAt(i, dummy.matrix); canopy.setColorAt(i, tmpColor.set(pick(CAN)).offsetHSL(0, 0, rr(-0.03, 0.04)));
  }
  canopy.frustumCulled = false; g.add(canopy);
  const aura = glow(0xfff2b0, 46, 0.35); aura.position.y = 26; g.add(aura);
  scene.add(g);
}

/* a wooden footbridge */
{
  const bz = 24, bx = riverX(bz), half = riverW(bz) + 4.6, by = waterAt(bx, bz);
  const wood = new THREE.MeshStandardMaterial({ color: 0x9a6a44, roughness: 0.9 }), woodDark = new THREE.MeshStandardMaterial({ color: 0x6e4a30, roughness: 0.9 });
  const g = new THREE.Group(); g.position.set(bx, by, bz);
  const N = 13;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1) * 2 - 1, x = t * half, y = 0.9 + 1.5 * (1 - t * t);
    const plank = new THREE.Mesh(new THREE.BoxGeometry(half * 2 / N + 0.12, 0.22, 2.6), i % 2 ? wood : woodDark);
    plank.position.set(x, y, 0); plank.rotation.z = -t * 0.36; g.add(plank);
    if (i % 3 === 0) for (const s of [-1, 1]) { const post = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.3, 0.2), woodDark); post.position.set(x, y + 0.7, s * 1.25); g.add(post); }
  }
  scene.add(g);
}

/* spirit crystals: a little magic by the water */
const crystalGeo = new THREE.OctahedronGeometry(1, 0); crystalGeo.scale(0.36, 1, 0.36);
function crystalCluster(x, z, hex, big) {
  const mat = new THREE.MeshStandardMaterial({ color: hex, emissive: hex, emissiveIntensity: 1.3, roughness: 0.15 });
  const g = new THREE.Group(); g.position.set(x, ground(x, z), z);
  const n = 4 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const c = new THREE.Mesh(crystalGeo, mat), s = (i === 0 ? 1.5 : rr(0.5, 1.1)) * big, a = rnd() * 6.28, d = i === 0 ? 0 : rr(0.35, 0.8) * big;
    c.scale.setScalar(s); c.position.set(Math.cos(a) * d, s * 0.7, Math.sin(a) * d); c.rotation.set(rr(-0.35, 0.35), rnd() * 6.28, rr(-0.35, 0.35)); g.add(c);
  }
  const gl = glow(hex, 8 * big, 0.6); gl.position.y = 1.3 * big; g.add(gl);
  scene.add(g);
}
crystalCluster(riverX(fallBot + 4) + 8, fallBot + 5, 0x7fe7ff, 1.5);
crystalCluster(riverX(fallBot + 2) - 9, fallBot + 3, 0x9ff5d0, 1.1);
crystalCluster(riverX(70) - riverW(70) - 6, 70, 0x7fe7ff, 1.2);
crystalCluster(treeX + 9, treeZ + 7, 0xffe08a, 0.9);

/* floating islands drifting above the ridges */
const rockMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 });
const islands = [];
function makeIsland(x, y, z, R, H, sd) {
  const group = new THREE.Group(); group.position.set(x, y, z);
  let rock = new THREE.ConeGeometry(R, H, 13, 6); rock.rotateX(Math.PI); rock.translate(0, -H / 2, 0);
  const p = rock.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const px = p.getX(i), py = p.getY(i), pz = p.getZ(i), t = Math.min(1, -py / H);
    if (t < 0.999) {
      const k = Math.pow(1 - t, 0.62) / (1 - t) * (1 + (hash(px, py, pz, sd) - 0.5) * (0.05 + 0.5 * Math.sin(Math.PI * t)));
      p.setXYZ(i, px * k, py + (t > 0.05 ? (hash(pz, px, py, sd + 1) - 0.5) * H * 0.08 : 0), pz * k);
    }
  }
  rock = flat(rock);
  const rp = rock.attributes.position, cols = new Float32Array(rp.count * 3), cTop = new THREE.Color(0x9a8f86), cBot = new THREE.Color(0x4a4a66);
  for (let i = 0; i < rp.count; i++) { tmpColor.copy(cTop).lerp(cBot, Math.pow(Math.min(1, Math.max(0, -rp.getY(i) / H)), 0.7)); cols[i * 3] = tmpColor.r; cols[i * 3 + 1] = tmpColor.g; cols[i * 3 + 2] = tmpColor.b; }
  rock.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  group.add(new THREE.Mesh(rock, rockMat));
  const th = R * 0.08, cap = new THREE.CylinderGeometry(R * 1.1, R, th, 13, 1); cap.translate(0, th / 2, 0);
  group.add(new THREE.Mesh(flat(cap), new THREE.MeshStandardMaterial({ color: 0x6fbf55, roughness: 0.9 })));
  const n = Math.round(R * 1.6), trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, n), leaves = new THREE.InstancedMesh(coneGeo, leafMat, n * 2);
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, d = Math.sqrt(rnd()) * R * 0.85, s = rr(1.2, 2.2), tx = Math.cos(a) * d, tz = Math.sin(a) * d;
    dummy.rotation.set(0, rnd() * 6, 0);
    dummy.position.set(tx, th, tz); dummy.scale.set(s, s * 1.4, s); dummy.updateMatrix(); trunks.setMatrixAt(i, dummy.matrix);
    tmpColor.set(pick(CONIFER));
    dummy.position.y = th + s * 0.9; dummy.scale.setScalar(s); dummy.updateMatrix(); leaves.setMatrixAt(i * 2, dummy.matrix); leaves.setColorAt(i * 2, tmpColor);
    dummy.position.y = th + s * 1.95; dummy.scale.setScalar(s * 0.7); dummy.updateMatrix(); leaves.setMatrixAt(i * 2 + 1, dummy.matrix); leaves.setColorAt(i * 2 + 1, tmpColor);
  }
  group.add(trunks, leaves); scene.add(group);
  islands.push({ group, y, phase: rnd() * 6.28, speed: rr(0.2, 0.4), amp: 1.2 });
}
makeIsland(-92, 78, -58, 11, 17, 1);
makeIsland(98, 92, -22, 8, 13, 2);
makeIsland(36, 108, -118, 13, 20, 3);
makeIsland(-70, 96, 70, 7, 11, 4);

/* clouds */
const clouds = new THREE.Group();
{
  const N = 16, PUFFS = 6, m = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xbfd4e6, emissiveIntensity: 0.35 }), N * PUFFS);
  for (let i = 0; i < N; i++) {
    const a = rnd() * 6.283, d = rr(70, 260), cx = Math.cos(a) * d, cz = Math.sin(a) * d, cy = rr(95, 150), s = rr(7, 14);
    for (let j = 0; j < PUFFS; j++) {
      dummy.position.set(cx + (j - PUFFS / 2) * s * 0.75 + rr(-2, 2), cy + rr(-0.15, 0.3) * s, cz + rr(-0.5, 0.5) * s);
      const k = s * rr(0.7, 1.15) * (1 - Math.abs(j - (PUFFS - 1) / 2) / PUFFS);
      dummy.rotation.set(rnd() * 3, rnd() * 3, 0); dummy.scale.set(k * 1.3, k * 0.75, k); dummy.updateMatrix(); m.setMatrixAt(i * PUFFS + j, dummy.matrix);
    }
  }
  m.frustumCulled = false; clouds.add(m); scene.add(clouds);
}

/* birds */
const BIRD_N = 18, birdData = [];
const birdGeo = new THREE.BufferGeometry();
birdGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0.6, 0, 0, -0.5, -1.5, 0.45, -0.3, 0, 0, 0.6, 1.5, 0.45, -0.3, 0, 0, -0.5]), 3));
const birds = new THREE.InstancedMesh(birdGeo, new THREE.MeshBasicMaterial({ color: 0x2a3440, side: THREE.DoubleSide }), BIRD_N);
for (let i = 0; i < BIRD_N; i++) { const flock = i % 3; birdData.push({ r: 34 + flock * 22 + rr(-5, 5), a: flock * 2.1 + rr(-0.25, 0.25), y: 42 + flock * 12 + rr(-3, 3), w: (0.11 - flock * 0.02) * (flock === 1 ? -1 : 1), p: rnd() * 6.28, cx: flock * 20 - 20, cz: flock * -25 + 20 }); }
birdGeo.computeVertexNormals(); birds.frustumCulled = false; scene.add(birds);

/* drifting motes of light */
const FLY_N = 280, flyData = [];
const flies = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }), FLY_N);
for (let i = 0; i < FLY_N; i++) {
  let x, z, up;
  const k = rnd();
  if (k < 0.4) { const a = rnd() * 6.283, d = Math.sqrt(rnd()) * 17; x = treeX + Math.cos(a) * d; z = treeZ + Math.sin(a) * d; up = rr(1, 30); }
  else if (k < 0.75) { z = rr(-64, 92); x = riverX(z) + rr(-1, 1) * (riverW(z) + 7); up = rr(0.8, 5); }
  else { const a = rnd() * 6.283, d = Math.sqrt(rnd()) * 100; x = Math.cos(a) * d; z = Math.sin(a) * d; up = rr(1, 9); }
  flyData.push({ x, y: Math.max(ground(x, z), waterAt(x, z)) + up, z, p: rnd() * 6.28, f: rr(0.3, 0.9), s: rr(0.5, 1.1) });
  flies.setColorAt(i, tmpColor.set(rnd() < 0.7 ? 0xffe9a0 : 0xbffff0));
}
flies.frustumCulled = false; scene.add(flies);

/* ---------- camera control ---------- */
const VIEWS = [
  { t: [0, 8, -8], r: 140, th: 0.3, ph: 0.98 },
  { t: [treeX, treeY + 15, treeZ], r: 52, th: 1.9, ph: 1.36 },
  { t: [fallMidX, fallBaseY + 4, fallMidZ], r: 58, th: 0.2, ph: 1.02 },
  { t: [riverX(72), 4, 72], r: 62, th: 3.5, ph: 1.22 },
];
const cur = { th: 0.3, ph: 0.8, r: 215, t: new THREE.Vector3(0, 10, -8) };
const goal = { th: 0.3, ph: 0.98, r: 140, t: new THREE.Vector3(0, 10, -8) };
let auto = !matchMedia('(prefers-reduced-motion: reduce)').matches;
$('auto').setAttribute('aria-pressed', String(auto));
let lastTouch = -10, now = 0;
const R_MIN = 12, R_MAX = 175, PH_MIN = 0.3, PH_MAX = 1.55;
const pts = new Map(); let pinch = 0;
const touched = () => { lastTouch = now; $('hint').classList.add('gone'); };
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; touched(); });
canvas.addEventListener('pointermove', (e) => {
  const p = pts.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p[0], dy = e.clientY - p[1]; p[0] = e.clientX; p[1] = e.clientY;
  if (pts.size === 1) {
    goal.th -= dx * 0.006; goal.ph = Math.min(PH_MAX, Math.max(PH_MIN, goal.ph - dy * 0.005));
  } else if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch > 0) goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r * pinch / d));
    pinch = d;
  }
  touched();
});
const up = (e) => { pts.delete(e.pointerId); pinch = 0; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r * Math.exp(e.deltaY * 0.001))); touched(); }, { passive: false });
canvas.addEventListener('keydown', (e) => {
  const k = e.key; let hit = true;
  if (k === 'ArrowLeft') goal.th += 0.12; else if (k === 'ArrowRight') goal.th -= 0.12;
  else if (k === 'ArrowUp') goal.ph = Math.max(PH_MIN, goal.ph - 0.08); else if (k === 'ArrowDown') goal.ph = Math.min(PH_MAX, goal.ph + 0.08);
  else if (k === '+' || k === '=') goal.r = Math.max(R_MIN, goal.r * 0.9); else if (k === '-') goal.r = Math.min(R_MAX, goal.r * 1.1);
  else hit = false;
  if (hit) { e.preventDefault(); touched(); }
});
VIEWS.forEach((v, i) => $('v' + i).addEventListener('click', () => {
  goal.t.set(...v.t); goal.r = v.r; goal.ph = v.ph;
  goal.th = v.th + Math.round((goal.th - v.th) / 6.2832) * 6.2832;
  VIEWS.forEach((_, j) => $('v' + j).setAttribute('aria-pressed', String(i === j)));
  $('hint').classList.add('gone');
}));
$('auto').addEventListener('click', () => { auto = !auto; $('auto').setAttribute('aria-pressed', String(auto)); lastTouch = -10; });

function resize() {
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w < h ? 72 : 55; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

/* ---------- frame loop ---------- */
const clock = new THREE.Clock();
let first = true;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); now += dt; const t = now;

  if (auto && pts.size === 0 && t - lastTouch > 2.5) goal.th += dt * 0.06;
  const k = 1 - Math.exp(-dt * 3.2);
  cur.th += (goal.th - cur.th) * k; cur.ph += (goal.ph - cur.ph) * k; cur.r += (goal.r - cur.r) * k; cur.t.lerp(goal.t, k);
  const sp = Math.sin(cur.ph);
  camera.position.set(cur.t.x + cur.r * sp * Math.sin(cur.th), cur.t.y + cur.r * Math.cos(cur.ph), cur.t.z + cur.r * sp * Math.cos(cur.th));
  const floor = Math.max(ground(camera.position.x, camera.position.z), waterAt(camera.position.x, camera.position.z)) + 3;   // never dip under the land
  if (camera.position.y < floor) camera.position.y = floor;
  camera.lookAt(cur.t);

  for (const i of islands) { i.group.position.y = i.y + Math.sin(t * i.speed + i.phase) * i.amp; i.group.rotation.y = Math.sin(t * 0.08 + i.phase) * 0.05; }
  clouds.rotation.y = t * 0.004;
  for (const m of mists) { m.s.scale.setScalar(m.base * (1 + 0.18 * Math.sin(t * 0.9 + m.p))); m.s.material.opacity = 0.24 + 0.1 * Math.sin(t * 0.7 + m.p * 2); }

  dummy.rotation.set(0, 0, 0);
  for (let i = 0; i < SPRAY_N; i++) {
    const d = sprayData[i], u = (t * d.v + d.o) % 1, z = fallTop - 1 + u * (fallBot - fallTop + 4), x = riverX(z) + d.a * (riverW(z) + 1.5);
    dummy.position.set(x, waterAt(x, z) + 0.25 + Math.sin(u * Math.PI) * 0.5, z);
    dummy.rotation.x = Math.atan2(waterAt(x, z - 0.4) - waterAt(x, z + 0.4), 0.8);
    dummy.scale.set(d.s, d.s, d.s * (0.6 + Math.sin(u * Math.PI) * 1.6)); dummy.updateMatrix(); spray.setMatrixAt(i, dummy.matrix);
  }
  spray.instanceMatrix.needsUpdate = true;

  for (let i = 0; i < BIRD_N; i++) {
    const d = birdData[i], a = d.a + t * d.w;
    dummy.position.set(d.cx + Math.cos(a) * d.r, d.y + Math.sin(t * 0.5 + d.p) * 1.5, d.cz + Math.sin(a) * d.r);
    dummy.rotation.set(0, -a + (d.w < 0 ? Math.PI : 0), 0); dummy.scale.set(1, Math.sin(t * 7 + d.p) * 1.2, 1);
    dummy.updateMatrix(); birds.setMatrixAt(i, dummy.matrix);
  }
  birds.instanceMatrix.needsUpdate = true;

  dummy.quaternion.copy(camera.quaternion);
  for (let i = 0; i < FLY_N; i++) {
    const d = flyData[i], a = t * d.f + d.p;
    dummy.position.set(d.x + Math.sin(a) * 1.6, d.y + Math.sin(a * 1.7 + d.p) * 1.0, d.z + Math.cos(a * 0.8) * 1.6);
    dummy.scale.setScalar(d.s * (0.55 + 0.45 * Math.sin(t * 2.5 * d.f + d.p * 3)));
    dummy.updateMatrix(); flies.setMatrixAt(i, dummy.matrix);
  }
  flies.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
  if (first) { first = false; $('veil').classList.add('gone'); setTimeout(() => $('hint').classList.add('gone'), 9000); }
});
