<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<title>翠緑の谷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap">
<style>
  /* Layout: one full-screen valley scene; quiet glass controls float at the corners. Single look by choice. */
  :root {
    color-scheme: dark;
    --deep: #0c1f1a;
    --ink: #f6fcf3;
    --ink-soft: #d6e8d8;
    --glass: rgba(10, 34, 30, 0.52);
    --glass-line: rgba(214, 240, 220, 0.3);
    --ember: #ffd27a;
    --aether: #8ff0d0;
    --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --ui: -apple-system, "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--deep);
    color: var(--ink);
    font-family: var(--ui);
    overflow: hidden;
    position: relative;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: absolute; inset: 0; }
  #scene { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .hud {
    position: absolute; left: 0; right: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 12px; pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .hud-top { top: 14px; justify-content: space-between; align-items: flex-start; }
  .hud-bottom { bottom: 16px; flex-direction: column; align-items: center; gap: 10px; }

  .title { pointer-events: none; text-shadow: 0 1px 3px rgba(6, 30, 40, 0.75), 0 2px 18px rgba(6, 30, 40, 0.7); }
  .title small {
    display: block; font-size: 10px; letter-spacing: 0.32em; color: var(--ink);
    text-transform: uppercase; margin-bottom: 4px;
  }
  .title h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: 0.12em; }

  .badge {
    font-size: 11px; letter-spacing: 0.08em; padding: 6px 10px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-line); color: var(--ink-soft);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); }
  .badge.gpu i { background: var(--aether); box-shadow: 0 0 8px var(--aether); }
  .badge.gl i { background: var(--ember); box-shadow: 0 0 8px var(--ember); }

  .hint { font-size: 12px; color: var(--ink); text-shadow: 0 1px 3px rgba(6, 30, 40, 0.9), 0 1px 12px rgba(6, 30, 40, 0.9); transition: opacity 1.2s; text-align: center; }
  .hint.gone { opacity: 0; }

  .bar {
    display: flex; gap: 2px; padding: 4px; border-radius: 999px; max-width: 100%;
    background: var(--glass); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .bar button {
    font: inherit; font-size: 13px; color: var(--ink-soft); background: transparent; border: 0;
    padding: 9px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .bar button[aria-pressed="true"] { background: rgba(214, 240, 220, 0.24); color: var(--ink); }
  .bar button:focus-visible { outline: 2px solid var(--aether); outline-offset: 1px; }
  .bar .sep { width: 1px; background: var(--glass-line); margin: 6px 2px; }

  #veil {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 60%, #1f5a45 0%, var(--deep) 70%);
    transition: opacity 1.4s ease; padding: 24px;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil p { font-family: var(--display); font-size: 16px; letter-spacing: 0.3em; color: var(--ink-soft); margin: 0; line-height: 1.9; }
  @media (prefers-reduced-motion: reduce) { #veil, .hint { transition: none; } }
</style>

<div id="stage"><canvas id="scene" tabindex="0" aria-label="森と川が広がる谷の3D空間。ドラッグで見回せます"></canvas></div>

<div class="hud hud-top">
  <div class="title"><small>Verdant Vale</small><h1>翠緑の谷</h1></div>
  <div class="badge" id="badge"><i></i><span id="badgeText">起動中</span></div>
</div>

<div class="hud hud-bottom">
  <div class="hint" id="hint">ドラッグで見回す ・ ピンチで近づく</div>
  <div class="bar" role="group" aria-label="視点">
    <button id="v0" aria-pressed="true">全景</button>
    <button id="v1" aria-pressed="false">大樹</button>
    <button id="v2" aria-pressed="false">滝</button>
    <button id="v3" aria-pressed="false">湖</button>
    <span class="sep"></span>
    <button id="auto" aria-pressed="true">自動回転</button>
  </div>
</div>

<div id="veil"><p id="veilText">森を呼び起こしています…</p></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const fail = (msg) => { $('veilText').textContent = msg; $('badgeText').textContent = '停止'; };

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.min.js');
} catch (e) {
  fail('three.js を読み込めませんでした。通信環境を確認して開き直してください。');
  throw e;
}
const { color, float, vec3, time, sin, cos, mix, smoothstep, positionLocal, positionWorld, normalWorld, cameraPosition, uv, attribute,
        mx_noise_float, pow, normalize, dot, max, abs, clamp, reflect } = THREE.TSL;

/* ---------- renderer (WebGPU, falls back to WebGL 2 by itself) ---------- */
const canvas = $('scene');
const stage = $('stage');
let renderer;
try {
  renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
  await renderer.init();
} catch (e) {
  fail('この端末では3D描画を開始できませんでした。');
  throw e;
}
const isGPU = renderer.backend && renderer.backend.isWebGPUBackend === true;
$('badge').classList.add(isGPU ? 'gpu' : 'gl');
$('badgeText').textContent = isGPU ? 'WebGPU' : 'WebGL 2';
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
const HAZE = 0xc3d9ec;
scene.fog = new THREE.FogExp2(HAZE, 0.0031);
const camera = new THREE.PerspectiveCamera(55, 1, 0.5, 2400);

/* ---------- helpers ---------- */
let seed = 20261124;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const pick = (a) => a[Math.floor(rnd() * a.length)];
const hash = (x, y, z, s) => { const n = Math.sin(Math.round(x * 100) * 1.271 + Math.round(y * 100) * 3.117 + Math.round(z * 100) * 0.747 + s * 13.37) * 43758.5453; return n - Math.floor(n); };
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const h2 = (i, j) => { const n = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return n - Math.floor(n); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return (h2(xi, yi) * (1 - u) + h2(xi + 1, yi) * u) * (1 - v) + (h2(xi, yi + 1) * (1 - u) + h2(xi + 1, yi + 1) * u) * v;
}
function fbm(x, y) { let a = 0.5, s = 0, n = 0; for (let i = 0; i < 4; i++) { s += a * vnoise(x, y); n += a; x = x * 2.03 + 17; y = y * 2.03 + 31; a *= 0.5; } return s / n; }
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();
const n01 = (p) => mx_noise_float(p).mul(0.5).add(0.5);          // shader noise in 0..1

// Merge geometry parts into one mesh with per-vertex tint (rgb) and sway weight.
function merge(parts) {
  const P = [], N = [], T = [], S = [];
  for (const { geo, tint, sway } of parts) {
    const g = geo.index ? geo.toNonIndexed() : geo, p = g.attributes.position, n = g.attributes.normal;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      P.push(x, y, z); N.push(n.getX(i), n.getY(i), n.getZ(i)); T.push(...tint(x, y, z)); S.push(sway(x, y, z));
    }
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  out.setAttribute('tint', new THREE.Float32BufferAttribute(T, 3));
  out.setAttribute('sway', new THREE.Float32BufferAttribute(S, 1));
  return out;
}
// A lumpy sphere: icosphere pushed in and out along its radius, keeping soft normals.
function lump(radius, detail, amp, sd, sx = 1, sy = 1, sz = 1) {
  const g = new THREE.IcosahedronGeometry(1, detail), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), k = radius * (1 + (hash(x, y, z, sd) - 0.5) * amp);
    p.setXYZ(i, x * k * sx, y * k * sy, z * k * sz);
  }
  return g;
}

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.18, 'rgba(255,255,255,0.75)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = glowTexture();
function glow(hex, size, opacity = 1, additive = true) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: hex, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false, transparent: true, opacity }));
  s.scale.setScalar(size); return s;
}

/* ---------- the shape of the land ---------- */
const riverX = (z) => 18 * Math.sin(z * 0.035) + 8 * Math.sin(z * 0.09 + 1);
const riverW = (z) => (3.2 + 24 * sm(48, 80, z)) * (1 - sm(86, 97, z));            // widens into the lake
function mount(x, z) { const m = sm(88, 150, Math.hypot(x, z * 0.95)); return Math.pow(m, 1.3) * (52 + 40 * vnoise(x * 0.02 + 3, z * 0.02 + 7)); }
function waterAt(x, z) {                                                             // water surface, incl. the waterfall step
  const zs = z + 6 * Math.sin(x * 0.05);
  return 2 + 6 * Math.min(1, Math.max(0, (48 - z) / 140)) + 10 * (1 - sm(-68.5, -65.5, zs)) + mount(x, z);
}
function ground(x, z) {
  const w = riverW(z), d = Math.abs(x - riverX(z)), live = 1 - sm(93, 98, z);
  const bank = 0.5 + live * (-1.9 + 1.9 * sm(w, w + 3.5, d));
  const hills = Math.max(-0.2, 17 * (fbm(x * 0.025, z * 0.025) - 0.25)) * sm(w + 3, w + 55, d)
              + 1.2 * (vnoise(x * 0.15, z * 0.15) - 0.5) * sm(w + 3, w + 10, d)
              + 0.35 * (vnoise(x * 0.6, z * 0.6) - 0.5) * sm(w + 3, w + 8, d);
  return waterAt(x, z) + bank + hills;
}
const slopeAt = (x, z) => Math.hypot(ground(x + 1, z) - ground(x - 1, z), ground(x, z + 1) - ground(x, z - 1)) / 2;
const forestAt = (x, z) => fbm(x * 0.018 + 5, z * 0.018 + 9);
const shoreDist = (x, z) => Math.abs(x - riverX(z)) - riverW(z);

/* ---------- sky: gradient, sun disc and drifting clouds, all in one shader ---------- */
const sunDir = new THREE.Vector3(0.5, 0.52, 0.69).normalize();
const SKY_ZENITH = 0x1d5cb4, SKY_MID = 0x5d9fe0;
{
  const dir = normalize(positionLocal), h = dir.y;
  const sunV = vec3(sunDir.x, sunDir.y, sunDir.z), d = max(dot(dir, sunV), 0);
  let c = mix(color(HAZE), color(SKY_MID), smoothstep(0.0, 0.3, h));
  c = mix(c, color(SKY_ZENITH), smoothstep(0.25, 0.95, h));
  c = c.add(color(0xffe2b0).mul(pow(d, 10).mul(0.28)));
  const cloudFbm = (px, py) => {
    let s = null, a = 0.5, f = 1;
    for (let i = 0; i < 4; i++) { const n = mx_noise_float(vec3(px.mul(f).add(time.mul(0.012 * (i + 1))), py.mul(f), float(f * 1.7))).mul(a); s = s ? s.add(n) : n; a *= 0.5; f *= 2.13; }
    return s.mul(0.53).add(0.5);
  };
  const cp = dir.xz.div(h.add(0.25)).mul(1.15);
  const dens = cloudFbm(cp.x, cp.y);
  const toward = cloudFbm(cp.x.add(0.14), cp.y.add(0.2));            // density a step toward the sun, for self-shadowing
  const cover = smoothstep(0.5, 0.74, dens).mul(smoothstep(0.03, 0.26, h));
  const lit = clamp(float(1.05).sub(toward.sub(0.45).mul(1.5)), 0.5, 1.12);
  c = mix(c, mix(color(0x7f93b0), color(0xffffff), lit), cover.mul(0.92));
  c = c.add(color(0xfff1d0).mul(smoothstep(0.9993, 0.9997, d).mul(9).add(pow(d, 300).mul(1.6))));
  c = mix(color(HAZE), c, smoothstep(-0.08, 0.04, h));
  const m = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, fog: false, depthWrite: false });
  m.colorNode = c;
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1100, 48, 24), m);
  sky.renderOrder = -10; scene.add(sky);
  // two pale day moons
  for (const [x, y, z, r, o] of [[-520, 430, -640, 58, 0.5], [-330, 520, -700, 19, 0.4]]) {
    const moon = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 20), new THREE.MeshBasicMaterial({ color: 0xeaf3ff, transparent: true, opacity: o, fog: false, depthWrite: false }));
    moon.position.set(x, y, z); moon.renderOrder = -9; scene.add(moon);
  }
}

/* ---------- light and shadow ---------- */
scene.add(new THREE.HemisphereLight(0xbdd8ff, 0x6a6844, 1.7));
const sunLight = new THREE.DirectionalLight(0xfff0d8, 4.2);
sunLight.position.copy(sunDir).multiplyScalar(260);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -175, right: 175, top: 175, bottom: -175, near: 20, far: 620 });
sunLight.shadow.bias = -0.002; sunLight.shadow.normalBias = 1.3;
sunLight.shadow.autoUpdate = false; sunLight.shadow.needsUpdate = true;      // the world is static: bake the shadow map once
scene.add(sunLight);
const lit = (m, cast = true, receive = true) => { m.castShadow = cast; m.receiveShadow = receive; return m; };

/* ---------- terrain: smooth surface, materials blended per pixel ---------- */
{
  const S = 360, SEG = 256;
  const g = new THREE.PlaneGeometry(S, S, SEG, SEG); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, data = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, ground(x, z));
    const sd = shoreDist(x, z), live = z < 96;
    data[i * 3] = sm(0.44, 0.56, forestAt(x, z));                 // forest floor
    data[i * 3 + 1] = live ? 1 - sm(2.0, 4.8, sd) : 0;            // sand and shingle
    data[i * 3 + 2] = live ? 1 - sm(0.0, 2.4, sd) : 0;            // wet river bed
  }
  g.setAttribute('data', new THREE.BufferAttribute(data, 3));
  g.computeVertexNormals();
  const wp = positionWorld, d = attribute('data', 'vec3'), ny = normalWorld.y;
  const big = n01(vec3(wp.x.mul(0.03), wp.z.mul(0.03), 1));
  const mid = n01(vec3(wp.x.mul(0.22), wp.z.mul(0.22), 4));
  const fine = n01(vec3(wp.x.mul(1.9), wp.z.mul(1.9), 9));
  const grain = fine.mul(0.5).add(0.75);
  let c = mix(color(0x4a7a28), color(0x8fa544), big.mul(0.6).add(mid.mul(0.4))).mul(grain);
  c = mix(c, mix(color(0x2a3719), color(0x4b4226), mid).mul(grain), d.x.mul(0.9));
  c = mix(c, color(0x6f8046).mul(grain), smoothstep(30, 48, wp.y));
  c = mix(c, mix(color(0xa3956f), color(0xcfc3a0), mid).mul(fine.mul(0.3).add(0.85)), d.y);
  c = mix(c, color(0x46584a).mul(grain), d.z);
    const rockC = mix(color(0x514e4a), color(0x918b80), mid.mul(0.7).add(big.mul(0.3))).mul(grain);
  const rockF = max(float(1).sub(smoothstep(0.42, 0.62, ny.add(fine.sub(0.5).mul(0.14)))), smoothstep(47, 58, wp.y.add(mid.mul(6))));
  c = mix(c, rockC, rockF);
  c = mix(c, color(0xf1f4fa), smoothstep(56, 66, wp.y.add(mid.mul(8))).mul(smoothstep(0.3, 0.55, ny)));
  const m = new THREE.MeshStandardNodeMaterial({ roughness: 0.96, metalness: 0 });
  m.colorNode = c;
  scene.add(lit(new THREE.Mesh(g, m), true, true));
}

/* ---------- river, waterfall and lake: one ribbon with reflective, flowing water ---------- */
{
  const Z0 = -152, Z1 = 97, COLS = 11, rows = Z1 - Z0 + 1;
  const pos = new Float32Array(rows * COLS * 3), uvs = new Float32Array(rows * COLS * 2), foam = new Float32Array(rows * COLS), idx = [];
  for (let r = 0; r < rows; r++) {
    const z = Z0 + r, cx = riverX(z), hw = riverW(z) + 3.5;
    for (let c = 0; c < COLS; c++) {
      const u = c / (COLS - 1), x = cx + (u * 2 - 1) * hw, i = r * COLS + c;
      pos[i * 3] = x; pos[i * 3 + 1] = waterAt(x, z); pos[i * 3 + 2] = z;
      uvs[i * 2] = u; uvs[i * 2 + 1] = r / rows;
      foam[i] = sm(0.3, 1.1, Math.abs(waterAt(x, z + 0.5) - waterAt(x, z - 0.5)));
      if (r < rows - 1 && c < COLS - 1) idx.push(i, i + COLS, i + 1, i + 1, i + COLS, i + COLS + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setAttribute('foam', new THREE.BufferAttribute(foam, 1));
  g.setIndex(idx); g.computeVertexNormals();

  const wp = positionWorld, t = time;
  const wave = (ox, oz) => {                                    // ripple height at an offset, two octaves moving downstream
    const x = wp.x.add(ox), z = wp.z.add(oz);
    return mx_noise_float(vec3(x.mul(0.55), z.mul(0.55).sub(t.mul(0.9)), t.mul(0.12)))
      .add(mx_noise_float(vec3(x.mul(1.7).add(3), z.mul(1.7).sub(t.mul(1.6)), t.mul(0.2))).mul(0.45));
  };
  const h0 = wave(0, 0), e = 0.35;
  const nrm = normalize(vec3(h0.sub(wave(e, 0)).mul(0.16), 1, h0.sub(wave(0, e)).mul(0.16)));
  const V = normalize(cameraPosition.sub(wp));
  const fres = pow(float(1).sub(max(dot(nrm, V), 0)), 4).mul(0.94).add(0.05);
  const R = reflect(V.negate(), nrm);
  const skyRefl = mix(color(HAZE), color(SKY_MID), smoothstep(0.0, 0.5, R.y)).mul(1.05);
  const edge = abs(uv().x.sub(0.5)).mul(2), deepF = float(1).sub(smoothstep(0.5, 0.97, edge));
  const body = mix(color(0x3b7a70), color(0x0a3138), deepF);
  const sunV = vec3(sunDir.x, sunDir.y, sunDir.z);
  const glint = pow(max(dot(R, sunV), 0), 600).mul(2);
  let c = mix(body, skyRefl, fres).add(color(0xfff2d6).mul(glint));
  const streak = n01(vec3(wp.x.mul(1.1), wp.z.mul(0.35).sub(t.mul(1.5)), wp.y.mul(1.6)));
  const fa = attribute('foam', 'float');
  const f = clamp(fa.mul(0.55).add(fa.mul(streak).mul(0.9)).add(smoothstep(0.72, 0.92, streak).mul(smoothstep(0.75, 1.0, edge)).mul(0.5)), 0, 1);
  const m = new THREE.MeshBasicNodeMaterial({ transparent: true, side: THREE.DoubleSide });
  m.colorNode = mix(c, color(0xf4f8fb).mul(streak.mul(0.25).add(0.85)), f);
  m.opacityNode = clamp(mix(float(0.35), float(0.93), deepF).add(fres.mul(0.5)).add(f), 0, 1);
  scene.add(new THREE.Mesh(g, m));
}
// where the waterfall is
let fallTop = null, fallBot = -60;
for (let z = -80; z < -50; z += 0.25) { const s = waterAt(riverX(z), z - 0.25) - waterAt(riverX(z), z + 0.25); if (s > 0.3) { if (fallTop === null) fallTop = z; fallBot = z; } }
if (fallTop === null) fallTop = -70;
const fallMidZ = (fallTop + fallBot) / 2, fallMidX = riverX(fallMidZ), fallBaseY = waterAt(riverX(fallBot + 1), fallBot + 1);
const mists = [];
for (let i = 0; i < 9; i++) {
  const s = glow(0xffffff, rr(7, 14), 0.28, false);
  s.position.set(riverX(fallBot) + rr(-4.5, 4.5), fallBaseY + rr(0.5, 4), fallBot + rr(0, 4)); scene.add(s);
  mists.push({ s, p: rnd() * 6.28, base: s.scale.x });
}

/* ---------- trees ---------- */
const swayNode = (amt) => positionLocal.add(vec3(
  sin(time.mul(1.3).add(positionLocal.x.mul(0.35)).add(positionLocal.z.mul(0.27))).mul(amt), 0,
  cos(time.mul(1.05).add(positionLocal.z.mul(0.33))).mul(amt * 0.7)).mul(attribute('sway', 'float')));
function foliageMaterial(amt) {
  const m = new THREE.MeshStandardNodeMaterial({ roughness: 0.88, metalness: 0, side: THREE.DoubleSide });
  const wp = positionWorld;
  const clump = smoothstep(-0.4, 0.5, mx_noise_float(wp.mul(2.7)));          // dark gaps between leaf masses
  const leafy = n01(wp.mul(11)).mul(0.4).add(0.8);
  m.colorNode = attribute('tint', 'vec3').mul(mix(float(0.66), float(1.08), clump)).mul(leafy);
  m.positionNode = swayNode(amt);
  return m;
}
const leafMat = foliageMaterial(0.11);
const BARK = [0.3, 0.22, 0.16];

function coniferGeo() {
  const parts = [];
  const trunk = new THREE.CylinderGeometry(0.06, 0.17, 2.2, 6); trunk.translate(0, 1.1, 0);
  parts.push({ geo: trunk, tint: () => BARK, sway: (x, y) => y * 0.05 });
  const TIERS = 7;
  for (let i = 0; i < TIERS; i++) {
    const t = i / (TIERS - 1), r = 1.2 * Math.pow(1 - t, 0.85) + 0.14, hgt = 1.35 - t * 0.35, y0 = 0.75 + i * 0.6;
    const cone = new THREE.ConeGeometry(r, hgt, 11, 1, true); cone.translate(0, y0 + hgt / 2, 0);
    const p = cone.attributes.position;
    for (let k = 0; k < p.count; k++) if (p.getY(k) < y0 + 0.01) {
      const x = p.getX(k), z = p.getZ(k), j = 0.78 + hash(x, i, z, 7) * 0.4;
      p.setXYZ(k, x * j, y0 - hash(z, i, x, 8) * 0.28, z * j);
    }
    cone.computeVertexNormals();
    parts.push({ geo: cone, tint: (x, y) => { const k = 0.62 + 0.4 * sm(y0 + hgt, y0, y); return [k, k, k]; }, sway: (x, y) => 0.25 + y * 0.14 });
  }
  return merge(parts);
}
function broadleafGeo() {
  const parts = [];
  const trunk = new THREE.CylinderGeometry(0.1, 0.24, 2.6, 6, 3); trunk.translate(0, 1.3, 0);
  const tp = trunk.attributes.position; for (let i = 0; i < tp.count; i++) tp.setX(i, tp.getX(i) + Math.sin(tp.getY(i) * 1.1) * 0.1);
  trunk.computeVertexNormals();
  parts.push({ geo: trunk, tint: () => BARK, sway: (x, y) => y * 0.04 });
  const blobs = [[0, 3.7, 0, 1.55], [0.95, 3.0, 0.5, 1.15], [-0.9, 3.1, 0.6, 1.1], [0.2, 2.9, -1.0, 1.15], [-0.4, 4.3, -0.3, 1.0]];
  blobs.forEach(([bx, by, bz, br], i) => {
    const g = lump(br, 1, 0.38, i + 11, 1, 0.84, 1); g.translate(bx, by, bz);
    parts.push({ geo: g, tint: (x, y) => { const k = 0.5 + 0.55 * sm(2.2, 4.6, y); return [k, k, k]; }, sway: (x, y) => 0.3 + y * 0.16 });
  });
  return merge(parts);
}
const CONIFER = [0x4a8050, 0x548c56, 0x457862, 0x5c965c, 0x4d8458];
const BROAD = [0x4a7a2a, 0x5d8a30, 0x3f6d2c, 0x6f9436, 0x557f2e, 0x86983c];

const treeX = riverX(8) + 21, treeZ = 8, treeY = ground(treeX, treeZ);   // the great tree
{
  const con = [], bro = [];
  let guard = 0;
  while (con.length + bro.length < 3800 && guard++ < 120000) {
    const a = rnd() * 6.283, d = Math.sqrt(rnd()) * 152, x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (shoreDist(x, z) < 4.8 && z < 98) continue;
    const y = ground(x, z); if (y > 54) continue;
    if (slopeAt(x, z) > 1.8) continue;
    const f = forestAt(x, z) + sm(18, 34, y) * 0.12;
    if (f < 0.47 + rnd() * 0.06 && rnd() > 0.035) continue;
    if (Math.hypot(x - treeX, z - treeZ) < 11) continue;
    const conifer = y > 20 + rnd() * 8 || vnoise(x * 0.03 + 40, z * 0.03) > 0.56;
    (conifer ? con : bro).push([x, y, z]);
  }
  const build = (list, geo, palette, sMin, sMax) => {
    const mesh = new THREE.InstancedMesh(geo, leafMat, list.length);
    list.forEach(([x, y, z], i) => {
      const s = rr(sMin, sMax);
      dummy.position.set(x, y - 0.25, z); dummy.rotation.set(rr(-0.04, 0.04), rnd() * 6.28, rr(-0.04, 0.04)); dummy.scale.set(s * rr(0.9, 1.1), s, s * rr(0.9, 1.1)); dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix); mesh.setColorAt(i, tmpColor.set(pick(palette)).offsetHSL(rr(-0.012, 0.012), rr(-0.05, 0.05), rr(-0.03, 0.03)));
    });
    mesh.frustumCulled = false; scene.add(lit(mesh));
  };
  build(con, coniferGeo(), CONIFER, 1.0, 1.9);
  build(bro, broadleafGeo(), BROAD, 0.95, 1.7);
}

/* meadow flowers: small specks of colour */
{
  const N = 2600, fl = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.1, 0), new THREE.MeshStandardMaterial({ roughness: 0.7 }), N);
  const FL = [0xffffff, 0xffffff, 0xf6dc60, 0xf6dc60, 0xe9a7c4, 0xb9a6ee];
  let n = 0, guard = 0;
  while (n < N && guard++ < 60000) {
    const a = rnd() * 6.283, d = Math.sqrt(rnd()) * 118, x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (shoreDist(x, z) < 4.2 && z < 98) continue;
    if (forestAt(x, z) > 0.5 || vnoise(x * 0.07, z * 0.07) < 0.45) continue;
    const y = ground(x, z); if (y > 30 || slopeAt(x, z) > 0.8) continue;
    dummy.position.set(x, y + 0.14, z); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(rr(0.7, 1.3)); dummy.updateMatrix();
    fl.setMatrixAt(n, dummy.matrix); fl.setColorAt(n, tmpColor.set(pick(FL))); n++;
  }
  fl.count = n; fl.frustumCulled = false; fl.receiveShadow = true; scene.add(fl);
}

/* riverside boulders */
const rockMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.93, metalness: 0 });
{
  const wp = positionWorld;
  const a = n01(wp.mul(0.9)), b = n01(wp.mul(5));
  const moss = smoothstep(0.55, 0.9, normalWorld.y).mul(smoothstep(0.45, 0.7, a));
  rockMat.colorNode = mix(mix(color(0x55524e), color(0x8e887e), a).mul(b.mul(0.45).add(0.75)), color(0x4b5f2c), moss.mul(0.7));
  const N = 320, rocks = new THREE.InstancedMesh(lump(1, 1, 0.5, 31), rockMat, N);
  for (let i = 0; i < N; i++) {
    const nearFall = i < 40, z = nearFall ? rr(fallTop - 3, fallBot + 6) : rr(-135, 92), w = riverW(z);
    const side = rnd() < 0.5 ? -1 : 1, off = nearFall && rnd() < 0.5 ? rr(-w, w) : side * (w + rr(0.6, 5));
    const x = riverX(z) + off, s = rr(0.4, 1.5) * (nearFall ? 1.4 : 1);
    dummy.position.set(x, ground(x, z) + s * 0.1, z); dummy.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6); dummy.scale.set(s, s * rr(0.5, 0.85), s * rr(0.7, 1)); dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix);
  }
  rocks.frustumCulled = false; scene.add(lit(rocks));
}

/* the great tree */
{
  const g = new THREE.Group(); g.position.set(treeX, treeY - 0.5, treeZ);
  const bark = new THREE.MeshStandardNodeMaterial({ roughness: 0.97, metalness: 0 });
  const wp = positionWorld;
  const ridges = n01(vec3(wp.x.mul(2.6), wp.y.mul(0.35), wp.z.mul(2.6)));
  bark.colorNode = mix(color(0x2c2018), color(0x6a5140), ridges).mul(n01(wp.mul(7)).mul(0.4).add(0.8));
  const tg = new THREE.CylinderGeometry(1.8, 4.6, 23, 18, 10, true); tg.translate(0, 11.5, 0);
  const tp = tg.attributes.position;
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), y = tp.getY(i), z = tp.getZ(i), a = Math.atan2(z, x);
    const k = 1 + 0.16 * Math.sin(a * 5 + y * 0.2) * (1 - y / 30) + 0.9 * Math.pow(Math.max(0, 1 - y / 5), 2) * (0.6 + 0.4 * Math.sin(a * 6));
    tp.setXYZ(i, x * k + Math.sin(y * 0.22) * 0.6, y, z * k);
  }
  tg.computeVertexNormals();
  g.add(lit(new THREE.Mesh(tg, bark)));
  for (let i = 0; i < 6; i++) {            // boughs
    const a = i / 6 * 6.283 + 0.4, b = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 1.0, 13, 8), bark);
    b.position.set(Math.cos(a) * 4.6, 23 + (i % 2) * 2, Math.sin(a) * 4.6); b.rotation.set(0, -a, 0); b.rotateZ(-0.95 + (i % 2) * 0.25); g.add(lit(b));
  }
  const N = 46, canopy = new THREE.InstancedMesh(merge([{ geo: lump(1, 2, 0.34, 51), tint: (x, y) => { const k = 0.55 + 0.5 * sm(-1, 1, y); return [k, k, k]; }, sway: () => 1 }]), foliageMaterial(0.2), N);
  const CAN = [0x4a8238, 0x578f3c, 0x3f763c, 0x659a42, 0x6fa046];
  for (let i = 0; i < N; i++) {
    const a = rnd() * 6.283, d = i < 6 ? rr(0, 4) : rr(4, 14), s = i < 6 ? rr(5.5, 7) : rr(3, 5);
    dummy.position.set(Math.cos(a) * d, (i < 6 ? 32 : rr(23, 33)) - d * 0.3, Math.sin(a) * d);
    dummy.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3); dummy.scale.set(s, s * 0.76, s); dummy.updateMatrix();
    canopy.setMatrixAt(i, dummy.matrix); canopy.setColorAt(i, tmpColor.set(pick(CAN)).offsetHSL(0, 0, rr(-0.02, 0.03)));
  }
  canopy.frustumCulled = false; g.add(lit(canopy));
  scene.add(g);
}

/* a wooden footbridge */
{
  const bz = 24, bx = riverX(bz), half = riverW(bz) + 4.6, by = waterAt(bx, bz);
  const wood = new THREE.MeshStandardNodeMaterial({ roughness: 0.9, metalness: 0 });
  wood.colorNode = mix(color(0x4f3622), color(0x8a6444), n01(vec3(positionWorld.x.mul(0.8), positionWorld.y.mul(6), positionWorld.z.mul(9))));
  const g = new THREE.Group(); g.position.set(bx, by, bz);
  const N = 15;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1) * 2 - 1, x = t * half, y = 0.9 + 1.5 * (1 - t * t);
    const plank = new THREE.Mesh(new THREE.BoxGeometry(half * 2 / N + 0.06, 0.18, 2.5), wood);
    plank.position.set(x, y, 0); plank.rotation.z = -t * 0.36; g.add(lit(plank));
    if (i % 2 === 0) for (const s of [-1, 1]) { const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 1.2, 6), wood); post.position.set(x, y + 0.6, s * 1.2); g.add(lit(post)); }
  }
  for (const s of [-1, 1]) for (let i = 0; i < N - 1; i += 2) {      // handrails between posts
    const t0 = i / (N - 1) * 2 - 1, t1 = (i + 2) / (N - 1) * 2 - 1;
    const a = new THREE.Vector3(t0 * half, 2.05 + 1.5 * (1 - t0 * t0), s * 1.2), b = new THREE.Vector3(t1 * half, 2.05 + 1.5 * (1 - t1 * t1), s * 1.2);
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, a.distanceTo(b), 5), wood);
    rail.position.copy(a).add(b).multiplyScalar(0.5); rail.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); g.add(lit(rail));
  }
  scene.add(g);
}

/* spirit crystals: a little magic by the water */
const crystalGeo = new THREE.OctahedronGeometry(1, 0); crystalGeo.scale(0.36, 1, 0.36);
function crystalCluster(x, z, hex, big) {
  const mat = new THREE.MeshPhysicalMaterial({ color: hex, emissive: hex, emissiveIntensity: 0.9, roughness: 0.08, metalness: 0, clearcoat: 1 });
  const g = new THREE.Group(); g.position.set(x, ground(x, z), z);
  const n = 4 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const c = new THREE.Mesh(crystalGeo, mat), s = (i === 0 ? 1.5 : rr(0.5, 1.1)) * big, a = rnd() * 6.28, d = i === 0 ? 0 : rr(0.35, 0.8) * big;
    c.scale.setScalar(s); c.position.set(Math.cos(a) * d, s * 0.7, Math.sin(a) * d); c.rotation.set(rr(-0.35, 0.35), rnd() * 6.28, rr(-0.35, 0.35)); g.add(lit(c, true, false));
  }
  const gl = glow(hex, 7 * big, 0.45); gl.position.y = 1.3 * big; g.add(gl);
  scene.add(g);
}
crystalCluster(riverX(fallBot + 4) + 8, fallBot + 5, 0x7fe7ff, 1.5);
crystalCluster(riverX(fallBot + 2) - 9, fallBot + 3, 0x9ff5d0, 1.1);
crystalCluster(riverX(70) - riverW(70) - 6, 70, 0x7fe7ff, 1.2);
crystalCluster(treeX + 9, treeZ + 7, 0xffe08a, 0.9);

/* birds */
const BIRD_N = 18, birdData = [];
const birdGeo = new THREE.BufferGeometry();
birdGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0.5, 0, 0, -0.4, -1.3, 0.4, -0.25, 0, 0, 0.5, 1.3, 0.4, -0.25, 0, 0, -0.4]), 3));
birdGeo.computeVertexNormals();
const birds = new THREE.InstancedMesh(birdGeo, new THREE.MeshBasicMaterial({ color: 0x1e242c, side: THREE.DoubleSide }), BIRD_N);
for (let i = 0; i < BIRD_N; i++) { const flock = i % 3; birdData.push({ r: 34 + flock * 22 + rr(-5, 5), a: flock * 2.1 + rr(-0.25, 0.25), y: 42 + flock * 12 + rr(-3, 3), w: (0.11 - flock * 0.02) * (flock === 1 ? -1 : 1), p: rnd() * 6.28, cx: flock * 20 - 20, cz: flock * -25 + 20 }); }
birds.frustumCulled = false; scene.add(birds);

/* drifting motes of light around the great tree and the water */
const FLY_N = 170, flyData = [];
const flies = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.8 }), FLY_N);
for (let i = 0; i < FLY_N; i++) {
  let x, z, up;
  if (rnd() < 0.6) { const a = rnd() * 6.283, d = Math.sqrt(rnd()) * 17; x = treeX + Math.cos(a) * d; z = treeZ + Math.sin(a) * d; up = rr(1, 30); }
  else { z = rr(-64, 92); x = riverX(z) + rr(-1, 1) * (riverW(z) + 7); up = rr(0.8, 5); }
  flyData.push({ x, y: Math.max(ground(x, z), waterAt(x, z)) + up, z, p: rnd() * 6.28, f: rr(0.3, 0.9), s: rr(0.3, 0.7) });
  flies.setColorAt(i, tmpColor.set(rnd() < 0.7 ? 0xffe9a0 : 0xbffff0));
}
flies.frustumCulled = false; scene.add(flies);

/* ---------- camera control ---------- */
const VIEWS = [
  { t: [0, 8, -8], r: 140, th: 0.3, ph: 0.98 },
  { t: [treeX, treeY + 15, treeZ], r: 52, th: 1.9, ph: 1.36 },
  { t: [fallMidX, fallBaseY + 4, fallMidZ], r: 58, th: 0.2, ph: 1.02 },
  { t: [riverX(72), 4, 72], r: 62, th: 3.5, ph: 1.22 },
];
const cur = { th: 0.3, ph: 0.8, r: 215, t: new THREE.Vector3(0, 8, -8) };
const goal = { th: 0.3, ph: 0.98, r: 140, t: new THREE.Vector3(0, 8, -8) };
let auto = !matchMedia('(prefers-reduced-motion: reduce)').matches;
$('auto').setAttribute('aria-pressed', String(auto));
let lastTouch = -10, now = 0;
const R_MIN = 12, R_MAX = 175, PH_MIN = 0.3, PH_MAX = 1.55;
const pts = new Map(); let pinch = 0;
const touched = () => { lastTouch = now; $('hint').classList.add('gone'); };
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; touched(); });
canvas.addEventListener('pointermove', (e) => {
  const p = pts.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p[0], dy = e.clientY - p[1]; p[0] = e.clientX; p[1] = e.clientY;
  if (pts.size === 1) {
    goal.th -= dx * 0.006; goal.ph = Math.min(PH_MAX, Math.max(PH_MIN, goal.ph - dy * 0.005));
  } else if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch > 0) goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r * pinch / d));
    pinch = d;
  }
  touched();
});
const up = (e) => { pts.delete(e.pointerId); pinch = 0; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r * Math.exp(e.deltaY * 0.001))); touched(); }, { passive: false });
canvas.addEventListener('keydown', (e) => {
  const k = e.key; let hit = true;
  if (k === 'ArrowLeft') goal.th += 0.12; else if (k === 'ArrowRight') goal.th -= 0.12;
  else if (k === 'ArrowUp') goal.ph = Math.max(PH_MIN, goal.ph - 0.08); else if (k === 'ArrowDown') goal.ph = Math.min(PH_MAX, goal.ph + 0.08);
  else if (k === '+' || k === '=') goal.r = Math.max(R_MIN, goal.r * 0.9); else if (k === '-') goal.r = Math.min(R_MAX, goal.r * 1.1);
  else hit = false;
  if (hit) { e.preventDefault(); touched(); }
});
VIEWS.forEach((v, i) => $('v' + i).addEventListener('click', () => {
  goal.t.set(...v.t); goal.r = v.r; goal.ph = v.ph;
  goal.th = v.th + Math.round((goal.th - v.th) / 6.2832) * 6.2832;
  VIEWS.forEach((_, j) => $('v' + j).setAttribute('aria-pressed', String(i === j)));
  $('hint').classList.add('gone');
}));
$('auto').addEventListener('click', () => { auto = !auto; $('auto').setAttribute('aria-pressed', String(auto)); lastTouch = -10; });

let dpr = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w < h ? 72 : 55; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

/* ---------- frame loop ---------- */
const clock = new THREE.Clock();
let first = true, acc = 0, frames = 0;
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05); now += dt; const t = now;

  // keep it smooth: if frames run long, render at a lower resolution
  if (t > 3) { acc += raw; frames++; if (acc > 2) { if (acc / frames > 0.03 && dpr > 1) { dpr = Math.max(1, dpr - 0.35); resize(); } acc = 0; frames = 0; } }

  if (auto && pts.size === 0 && t - lastTouch > 2.5) goal.th += dt * 0.06;
  const k = 1 - Math.exp(-dt * 3.2);
  cur.th += (goal.th - cur.th) * k; cur.ph += (goal.ph - cur.ph) * k; cur.r += (goal.r - cur.r) * k; cur.t.lerp(goal.t, k);
  const sp = Math.sin(cur.ph);
  camera.position.set(cur.t.x + cur.r * sp * Math.sin(cur.th), cur.t.y + cur.r * Math.cos(cur.ph), cur.t.z + cur.r * sp * Math.cos(cur.th));
  const floor = Math.max(ground(camera.position.x, camera.position.z), waterAt(camera.position.x, camera.position.z)) + 3;   // never dip under the land
  if (camera.position.y < floor) camera.position.y = floor;
  camera.lookAt(cur.t);

  for (const m of mists) { m.s.scale.setScalar(m.base * (1 + 0.18 * Math.sin(t * 0.9 + m.p))); m.s.material.opacity = 0.22 + 0.1 * Math.sin(t * 0.7 + m.p * 2); }

  for (let i = 0; i < BIRD_N; i++) {
    const d = birdData[i], a = d.a + t * d.w;
    dummy.position.set(d.cx + Math.cos(a) * d.r, d.y + Math.sin(t * 0.5 + d.p) * 1.5, d.cz + Math.sin(a) * d.r);
    dummy.rotation.set(0, -a + (d.w < 0 ? Math.PI : 0), 0); dummy.scale.set(1, Math.sin(t * 7 + d.p) * 1.2, 1);
    dummy.updateMatrix(); birds.setMatrixAt(i, dummy.matrix);
  }
  birds.instanceMatrix.needsUpdate = true;

  dummy.quaternion.copy(camera.quaternion);
  for (let i = 0; i < FLY_N; i++) {
    const d = flyData[i], a = t * d.f + d.p;
    dummy.position.set(d.x + Math.sin(a) * 1.6, d.y + Math.sin(a * 1.7 + d.p) * 1.0, d.z + Math.cos(a * 0.8) * 1.6);
    dummy.scale.setScalar(d.s * (0.55 + 0.45 * Math.sin(t * 2.5 * d.f + d.p * 3)));
    dummy.updateMatrix(); flies.setMatrixAt(i, dummy.matrix);
  }
  flies.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
  if (first) { first = false; $('veil').classList.add('gone'); setTimeout(() => $('hint').classList.add('gone'), 9000); }
});
</script>
